    <style>

        .nav-btn.active { color: #16a34a; }

        .nav-btn { color: #94a3b8; transition: all 0.2s; }
        .view-section { display: none; }

</head>
<body>

        </div>

                <input type="text" id="fb-apiKey" value="AIzaSyC_Z6srTcBfOWjG0aUKIoLD74ucozLUBHc" class="hidden">

    <div class="fixed bottom-0 left-0 w-full bg-white border-t border-slate-200 z-50 pb-safe shadow-[0_-5px_15px_rgba(0,0,0,0.05)]">
        <div class="flex justify-between items-center h-20 max-w-md mx-auto px-2">
            <button onclick="switchView('setup')" id="nav-setup" class="nav-btn active flex flex-col items-center w-[16%]"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l-.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l-.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg><span class="text-[11px] font-bold mt-1 uppercase">Setup</span></button>
            <button onclick="switchView('matches')" id="nav-matches" class="nav-btn flex flex-col items-center w-[16%]"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m4.93 4.93 14.14 14.14"/></svg><span class="text-[11px] font-bold mt-1 uppercase">Game</span></button>
            <button onclick="switchView('leader')" id="nav-leader" class="nav-btn flex flex-col items-center w-[16%]"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg><span class="text-[11px] font-bold mt-1 uppercase">Board</span></button>
            <button onclick="switchView('stats')" id="nav-stats" class="nav-btn flex flex-col items-center w-[16%]"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg><span class="text-[11px] font-bold mt-1 uppercase">Stats</span></button>

    <script>
        // --- HELPERS ---
        function el(id) { return document.getElementById(id); }
        function safeText(id, t) { const e = el(id); if(e) e.innerText = t; }
        function safeHTML(id, h) { const e = el(id); if(e) e.innerHTML = h; }
        function safeVal(id, v) { const e = el(id); if(e) e.value = v; }
        function safeClass(id, c) { const e = el(id); if(e) e.className = c; }
        function safeDisplay(id, d) { const e = el(id); if(e) e.style.display = d; }
        function showError(msg) { console.error(msg); alert(msg); }

        // --- STATE & DATA ---
        const ds = { matchDuration: 12, maxPoints: 21, courts: 2, winCondition: 'time', format: 'americano', rankingMode: 'points' };
        let players = [], matches = [], savedTournaments = [], settings = {...ds}, currentTid = null, curPh = null;
        let tempGender = 'M', timeLeft = 0, timerInterval, alarmInterval, isRunning = false, endTime = 0, dbRef = null, isCloud = false;

        let activeRoom = localStorage.getItem('r_v85') || '';
        if(activeRoom) isCloud = true;

        function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

        function getStore(key) {
            const prefix = isCloud ? `v85_room_${activeRoom}_` : `v85_local_`;
            return JSON.parse(localStorage.getItem(prefix + key));
        }
        function setStore(key, val) {
            const prefix = isCloud ? `v85_room_${activeRoom}_` : `v85_local_`;
            if (val === null) localStorage.removeItem(prefix + key);
            else localStorage.setItem(prefix + key, JSON.stringify(val));
        }

        // --- INIT ---
        try {
            players = (getStore('p') || []).filter(p => p && p.id);
            matches = getStore('m') || [];
            settings = {...ds, ...(getStore('s') || {})};
            savedTournaments = getStore('h') || [];
            currentTid = getStore('tid');
            timeLeft = settings.matchDuration * 60;
            if(activeRoom) { safeVal('fb-room', activeRoom); initFirebaseConnection(true); }
        } catch(e) { console.error("Init Error", e); localStorage.clear(); }

        // --- FIXED MATRICES (Proven) ---
        
        // 4 Players: 3 Rounds
        const MATRIX_4 = [
            [{t1:[0,1], t2:[2,3]}], 
            [{t1:[0,2], t2:[1,3]}], 
            [{t1:[0,3], t2:[1,2]}]
        ];

        // 8 Players: 7 Rounds (Hall's Design) - STATIC, NO RANDOM
        const MATRIX_8 = [
            [{t1:[0,7], t2:[1,6]}, {t1:[2,5], t2:[3,4]}], // R1
            [{t1:[0,6], t2:[2,4]}, {t1:[1,5], t2:[3,7]}], // R2 - Fixed Indices
            [{t1:[0,5], t2:[3,1]}, {t1:[2,6], t2:[4,7]}], // R3
            [{t1:[0,4], t2:[5,7]}, {t1:[1,2], t2:[3,6]}], // R4
            [{t1:[0,3], t2:[2,7]}, {t1:[1,4], t2:[5,6]}], // R5
            [{t1:[0,2], t2:[4,5]}, {t1:[1,7], t2:[3,6]}], // R6 - Fixed
            [{t1:[0,1], t2:[2,3]}, {t1:[4,6], t2:[5,7]}]  // R7
        ];

        // --- BRAINS: SMART PENALTY ENGINE ---
        function getHistoryStats() {
            const partners = new Map();
            const opponents = new Map();
            const allM = [...(savedTournaments || []).map(t=>t.matches).flat(), ...matches];
            
            allM.forEach(m => {
                if(m && m.team1 && m.team2) {
                    const addP = (p1, p2) => {
                        if(!p1 || !p2) return;
                        if(!partners.has(p1.id)) partners.set(p1.id, new Map());
                        const m1 = partners.get(p1.id); m1.set(p2.id, (m1.get(p2.id) || 0) + 1);
                    };
                    const addO = (p1, p2) => {
                        if(!p1 || !p2) return;
                        if(!opponents.has(p1.id)) opponents.set(p1.id, new Map());
                        const m1 = opponents.get(p1.id); m1.set(p2.id, (m1.get(p2.id) || 0) + 1);
                    };

                    if(m.team1.length > 1) { addP(m.team1[0], m.team1[1]); addP(m.team1[1], m.team1[0]); }
                    if(m.team2.length > 1) { addP(m.team2[0], m.team2[1]); addP(m.team2[1], m.team2[0]); }

                    m.team1.forEach(p1 => m.team2.forEach(p2 => { addO(p1, p2); addO(p2, p1); }));
                }
            });
            return { partners, opponents };
        }

        // --- GENERATOR LOGIC ---
        function generateRound() {
            try {
                if(players.length < 4) return alert("Min 4 žaidėjai!");
                
                // --- SAFELY GET PLAYERS (NO DUPLICATES) ---
                const safePool = [];
                const seenIds = new Set();
                players.forEach(p => {
                    if (p && p.id && !seenIds.has(p.id)) {
                        seenIds.add(p.id);
                        safePool.push(p);
                    }
                });

                let newM = [], roundNum = (matches.length > 0 ? (matches[matches.length-1].round || 0) : 0) + 1;
                
                // --- 1. FIKSUOTOS POROS ---
                if (settings.format === 'fixed') {
                    let teams = [];
                    for (let k = 0; k < safePool.length; k += 2) {
                        if (k + 1 < safePool.length) teams.push([safePool[k], safePool[k + 1]]);
                    }
                    let K = teams.length;
                    if (K < 2) return alert("Fiksuotoms poroms reikia bent 4 žaidėjų (2 porų).");
                    
                    let K_even = K % 2 === 0 ? K : K + 1;
                    let cycleRounds = K_even - 1;
                    let shift = (roundNum - 1) % cycleRounds;
                    let rotatedIndices = [0];
                    let others = [];
                    for (let i = 1; i < K_even; i++) others.push(i);
                    for (let i = 0; i < shift; i++) others.unshift(others.pop());
                    rotatedIndices.push(...others);
                    
                    let roundMatches = [];
                    for (let i = 0; i < K_even / 2; i++) {
                        let t1Idx = rotatedIndices[i];
                        let t2Idx = rotatedIndices[K_even - 1 - i];
                        if (t1Idx < K && t2Idx < K) roundMatches.push({ team1: teams[t1Idx], team2: teams[t2Idx] });
                    }
                    
                    roundMatches = roundMatches.slice(0, settings.courts);
                    roundMatches.forEach((m, idx) => { newM.push({ id: uid(), round: roundNum, court: idx + 1, finished: false, score1: 0, score2: 0, team1: m.team1, team2: m.team2 }); });
                    matches = [...matches, ...newM]; autoSave(); switchView('matches');
                    return;
                }

                // --- 2. AMERICANO 4 PLAYERS (FIXED MATRIX) ---
                if (settings.format === 'americano' && safePool.length === 4) {
                    const c = (roundNum - 1) % 3;
                    const cfg = MATRIX_4[c];
                    cfg.forEach((match, idx) => {
                        newM.push({ id: uid(), round: roundNum, court: idx + 1, finished: false, score1:0, score2:0, team1: [safePool[match.t1[0]], safePool[match.t1[1]]], team2: [safePool[match.t2[0]], safePool[match.t2[1]]] });
                    });
                    matches = [...matches, ...newM]; autoSave(); switchView('matches');
                    return;
                }

                // --- 3. AMERICANO 8 PLAYERS (HARDCODED ROTATION) ---
                // Removing Randomness entirely for 8 players to prevent "3 times vs same opponent"
                if (settings.format === 'americano' && safePool.length === 8) {
                    // Use a simple cyclic algorithm that is known to work for Americano 8
                    // Pivot 0. Others 1-7 rotate.
                    const pivot = safePool[0];
                    const others = safePool.slice(1);
                    const shift = (roundNum - 1) % 7;
                    
                    // Rotate others
                    for(let i=0; i<shift; i++) others.unshift(others.pop());
                    
                    // Pairs: (Pivot, Others[0]), (Others[1], Others[2])...
                    // Courts: 2
                    
                    // Court 1: P+O[0] vs O[1]+O[2]
                    newM.push({ 
                        id: uid(), round: roundNum, court: 1, finished: false, score1: 0, score2: 0, 
                        team1: [pivot, others[0]], 
                        team2: [others[1], others[2]] 
                    });
                    
                    // Court 2: O[3]+O[4] vs O[5]+O[6]
                    newM.push({ 
                        id: uid(), round: roundNum, court: 2, finished: false, score1: 0, score2: 0, 
                        team1: [others[3], others[4]], 
                        team2: [others[5], others[6]] 
                    });
                    
                    matches = [...matches, ...newM]; autoSave(); switchView('matches');
                    return;
                }

                // --- 4. UNIVERSAL SMART PENALTY GENERATOR (For 12, 16, Mix, etc.) ---
                const partnersHist = getPartnerHistory();
                const opponentsHist = getOpponentHistory();
                let bestSet = null, minPenalty = Infinity;

                // STRESS TEST: Run 500 simulations silently and pick best
                for(let i=0; i<500; i++) {
                    let pool = [...safePool].sort(() => Math.random() - 0.5);
                    let currentSet = [], currentPenalty = 0;
                    let valid = true;
                    
                    if(settings.format.includes('mix')) {
                        let m = pool.filter(p=>p.gender==='M'), f = pool.filter(p=>p.gender==='F');
                        let pairsCount = Math.min(m.length, f.length);
                        let courtsNeeded = Math.min(settings.courts, Math.floor(pairsCount/2));
                        
                        if(courtsNeeded > 0) {
                            for(let c=0; c<courtsNeeded; c++) {
                                const t1 = [m.pop(), f.pop()], t2 = [m.pop(), f.pop()];
                                if (t1[0].id === t1[1].id || t2[0].id === t2[1].id) { valid = false; break; } // Self check
                                
                                currentPenalty += (partnersHist.get(t1[0].id)?.get(t1[1].id) || 0) * 5000;
                                currentPenalty += (partnersHist.get(t2[0].id)?.get(t2[1].id) || 0) * 5000;
                                t1.forEach(p1 => t2.forEach(p2 => { 
                                    const games = opponentsHist.get(p1.id)?.get(p2.id) || 0;
                                    currentPenalty += Math.pow(games, 2) * 50; 
                                }));
                                currentSet.push({ team1: t1, team2: t2 });
                            }
                        }
                    } else {
                        let courtsNeeded = Math.min(settings.courts, Math.floor(pool.length/4));
                        for(let c=0; c<courtsNeeded; c++) {
                            const t1 = [pool.pop(), pool.pop()], t2 = [pool.pop(), pool.pop()];
                            if (t1[0].id === t1[1].id || t2[0].id === t2[1].id) { valid = false; break; } // Self check

                            currentPenalty += (partnersHist.get(t1[0].id)?.get(t1[1].id) || 0) * 5000;
                            currentPenalty += (partnersHist.get(t2[0].id)?.get(t2[1].id) || 0) * 5000;
                            t1.forEach(p1 => t2.forEach(p2 => { 
                                const games = opponentsHist.get(p1.id)?.get(p2.id) || 0;
                                currentPenalty += Math.pow(games, 2) * 50; 
                            }));
                            currentSet.push({ team1: t1, team2: t2 });
                        }
                    }

                    if(valid && currentSet.length > 0) {
                         if (currentPenalty < minPenalty) { 
                            minPenalty = currentPenalty; 
                            bestSet = currentSet; 
                            if(minPenalty === 0) break;
                        }
                    }
                }

                if(!bestSet && safePool.length >= 4) {
                    let pool = [...safePool].sort(() => Math.random() - 0.5);
                    bestSet = [{ team1: [pool.pop(), pool.pop()], team2: [pool.pop(), pool.pop()] }];
                }

                if(bestSet && bestSet.length > 0) {
                    bestSet.forEach((m, idx) => { newM.push({ id: uid(), round: roundNum, court: idx+1, finished: false, score1:0, score2:0, team1: m.team1, team2: m.team2 }); });
                    matches = [...matches, ...newM]; autoSave(); switchView('matches');
                } else {
                    alert("Nepakanka žaidėjų.");
                }
            } catch(e) { showError("Generavimo klaida: " + e.message); }
        }

        // --- DATA SYNC ---
        function autoSave() {
            try {
                if(players.length === 0 && matches.length === 0) return;
                if(!currentTid) {
                    currentTid = uid(); setStore('tid', currentTid);
                    savedTournaments.unshift({ id: currentTid, name: new Date().toLocaleDateString('lt-LT') + ' Turnyras', date: new Date().toISOString(), players: [], matches: [], settings: {} });
                }
                const idx = savedTournaments.findIndex(x => x.id === currentTid);
                if(idx > -1) {
                    savedTournaments[idx].players = JSON.parse(JSON.stringify(players));
                    savedTournaments[idx].matches = JSON.parse(JSON.stringify(matches));
                    savedTournaments[idx].settings = JSON.parse(JSON.stringify(settings));
                    savedTournaments[idx].lastUpdate = Date.now();
                }
                setStore('p', players); setStore('m', matches); setStore('s', settings); setStore('h', savedTournaments); setStore('tid', currentTid);
                
                if(isCloud && dbRef) {
                    const payload = { players, matches, settings, savedTournaments, currentTid, lastUpdate: Date.now() };
                    window.lastCloudUpdate = payload.lastUpdate;
                    dbRef.set(payload);
                }
                render();
            } catch (e) { showError("Klaida išsaugant: " + e.message); }
        }

        function calculateResults(mArr, pArr, isF = false) {
            let res = [];
            if(isF) { for(let i=0; i<pArr.length; i+=2) if(i+1 < pArr.length) res.push({ id: pArr[i].id+'_'+pArr[i+1].id, name: pArr[i].name+' / '+pArr[i+1].name, p1: pArr[i], p2: pArr[i+1], mp:0, w:0, t:0, l:0, sw:0, sl:0, dif:0, lp:0 }); }
            else { res = pArr.map(p => ({ ...p, mp:0, w:0, t:0, l:0, sw:0, sl:0, dif:0, lp:0 })); }
            
            mArr.filter(m => m.finished).forEach(m => {
                if(!m.team1 || !m.team2) return;
                const up = (team, myS, enS) => {
                    let targets = isF ? [res.find(r => r.p1.id === team[0].id || r.p2.id === team[0].id)] : team.map(p => res.find(r => r.id === p.id));
                    targets.forEach(s => { if(!s) return; s.mp++; s.sw += myS; s.sl += enS; s.dif = s.sw - s.sl; if(myS > enS) { s.w++; s.lp += 2; } else if(myS < enS) s.l++; else { s.t++; s.lp += 1; } });
                };
                up(m.team1, m.score1, m.score2); up(m.team2, m.score2, m.score1);
            });
            return res.sort((a,b) => settings.rankingMode === 'wins' ? (b.lp - a.lp || b.dif - a.dif) : (b.sw - a.sw || b.dif - a.dif));
        }

        function toggleTimer() {
            if(settings.winCondition==='score') return;
            if(alarmInterval) { clearInterval(alarmInterval); alarmInterval=null; resetTimer(); return; }
            if(isRunning) { clearInterval(timerInterval); isRunning=false; }
            else { if(timeLeft <= 0) return; isRunning = true; endTime = Date.now() + (timeLeft * 1000); timerInterval = setInterval(() => { const d = Math.ceil((endTime - Date.now())/1000); if(d > 0) { timeLeft = d; updateTimerUI(); } else { timeLeft = 0; clearInterval(timerInterval); isRunning = false; triggerAlarm(); } }, 1000); }
            updateTimerUI();
        }
        function updateTimerUI() {
            try {
                const m = Math.floor(timeLeft/60).toString().padStart(2,'0'), s = (timeLeft%60).toString().padStart(2,'0');
                safeText('timer-display', `${m}:${s}`);
                const b = el('btn-play'), i1=el('icon-play'), i2=el('icon-pause'), i3=el('icon-stop');
                if(i1 && i2 && i3 && b) {

                    if(alarmInterval) { b.className="w-14 h-14 rounded-full flex items-center justify-center bg-red-600 alarm-active"; i3.classList.remove('hidden'); }
                    else if(isRunning) { b.className="w-14 h-14 rounded-full flex items-center justify-center bg-orange-100 text-orange-600"; i2.classList.remove('hidden'); }
                    else { b.className="w-14 h-14 rounded-full flex items-center justify-center bg-green-600 text-white shadow-lg"; i1.classList.remove('hidden'); }
                }
            } catch(e) { console.error(e); }

        function playBuzzer() { try { const ctx = new (window.AudioContext || window.webkitAudioContext)(); const now = ctx.currentTime; const o1 = ctx.createOscillator(); const g = ctx.createGain(); o1.type = 'sawtooth'; o1.frequency.setValueAtTime(130, now); o1.connect(g); g.connect(ctx.destination); g.gain.setValueAtTime(0, now); g.gain.linearRampToValueAtTime(0.6, now+0.05); g.gain.setValueAtTime(0.6, now+1.8); g.gain.linearRampToValueAtTime(0, now+2); o1.start(); o1.stop(now+2); if(navigator.vibrate) navigator.vibrate(1000); } catch(e){} }
        function resetTimer() { timeLeft = settings.matchDuration * 60; isRunning = false; clearInterval(timerInterval); updateTimerUI(); }

        }
        function renderHistoryList() { safeHTML('history-list', savedTournaments.map(t => `<div class="bg-white p-4 rounded-xl border ${t.id===currentTid?'border-green-400 shadow-md':'border-slate-200'}"><div class="flex justify-between mb-1"><div class="font-bold text-slate-800 text-sm">${t.name}</div><div class="text-[9px] bg-slate-100 px-2 py-1 rounded font-black uppercase text-slate-500">${t.settings?.format || '---'}</div></div><div class="text-[10px] text-slate-400 mb-3">${new Date(t.date).toLocaleString('lt-LT')}</div><div class="flex gap-2"><button type="button" onclick="loadHistory('${t.id}')" class="flex-1 py-2 bg-blue-50 text-blue-600 rounded-lg font-bold text-xs uppercase">${t.id===currentTid?'Tęsti':'Užkrauti'}</button><button type="button" onclick="deleteHistory('${t.id}')" class="px-4 py-2 bg-red-50 text-red-500 rounded-lg font-bold">×</button></div></div>`).join('')); }
        function loadHistory(id) { const t = savedTournaments.find(x => x.id === id); if(t && confirm("Užkrauti?")) { players = JSON.parse(JSON.stringify(t.players)); matches = JSON.parse(JSON.stringify(t.matches)); settings = {...ds, ...t.settings}; currentTid = id; setStore('tid', id); resetTimer(); autoSave(); switchView('matches'); } }
        function deleteHistory(id) { if(confirm("Trinti?")) { savedTournaments = savedTournaments.filter(x => x.id !== id); if(currentTid===id) { currentTid=null; setStore('tid', null); } autoSave(); renderHistoryList(); } }
        function renderMatches() {
            try {
                const active = matches.filter(m => !m.finished);
                safeHTML('matches-container', active.map(m => `
                    <div class="bg-white rounded-2xl shadow-md border border-slate-100 overflow-hidden mb-4">
                        <div class="bg-slate-800 text-white px-4 py-1.5 text-[9px] font-black tracking-widest flex justify-between uppercase"><span>AIKŠTELĖ ${m.court}</span><span>RAUNDAS ${m.round}</span></div>
                        <div class="p-4"><div class="flex justify-between items-center mb-3"><div class="flex flex-col gap-1">${m.team1 ? m.team1.filter(p=>p).map(p => `<span class="font-bold text-lg text-slate-700">${p.name || '?'}</span>`).join('') : ''}</div><div class="flex items-center gap-2"><button type="button" onclick="updSc('${m.id}',1,-1)" class="w-10 h-10 bg-slate-50 border rounded-xl font-bold text-xl">-</button><span class="text-3xl font-black w-10 text-center">${m.score1}</span><button type="button" onclick="updSc('${m.id}',1,1)" class="w-10 h-10 bg-green-500 text-white rounded-xl font-bold text-xl">+</button></div></div>
                        <div class="flex justify-between items-center mb-5"><div class="flex flex-col gap-1">${m.team2 ? m.team2.filter(p=>p).map(p => `<span class="font-bold text-lg text-slate-700">${p.name || '?'}</span>`).join('') : ''}</div><div class="flex items-center gap-2"><button type="button" onclick="updSc('${m.id}',2,-1)" class="w-10 h-10 bg-slate-50 border rounded-xl font-bold text-xl">-</button><span class="text-3xl font-black w-10 text-center">${m.score2}</span><button type="button" onclick="updSc('${m.id}',2,1)" class="w-10 h-10 bg-green-500 text-white rounded-xl font-bold text-xl">+</button></div></div>
                        <button type="button" onclick="finM('${m.id}')" class="w-full py-3 bg-slate-900 text-white rounded-xl font-bold text-sm uppercase tracking-widest">Užbaigti Mačą</button></div>
                    </div>`).join(''));
                const fin = matches.filter(m => m.finished).reverse();
                safeHTML('finished-matches-container', fin.length ? '<h3 class="text-[9px] font-black text-slate-400 uppercase mb-3 tracking-widest">Paskutiniai mačai</h3>' + fin.map(m => `<div class="bg-white p-3 rounded-xl border mb-2 flex justify-between items-center text-[11px]"><div class="truncate font-bold text-slate-600">${m.team1?.filter(p=>p).map(p=>p.name).join('/')} vs ${m.team2?.filter(p=>p).map(p=>p.name).join('/')}</div><div class="flex items-center gap-3"><div class="font-black bg-slate-100 px-2 py-1 rounded text-slate-800">${m.score1}:${m.score2}</div><button type="button" onclick="undoM('${m.id}')" class="text-red-400 font-bold uppercase text-[9px]">Taisyti</button></div></div>`).join('') : '');
            } catch(e) { showError("Matches Render Error: " + e.message); }
        }

        function initFirebaseConnection(silent = false) {
            const room = el('fb-room')?.value.trim(); if(!room) return;
            const config = { apiKey: el('fb-apiKey').value, authDomain: el('fb-authDomain').value, databaseURL: el('fb-databaseURL').value, projectId: el('fb-projectId').value };
            try {
                if(!firebase.apps.length) firebase.initializeApp(config);
                activeRoom = room; isCloud = true; localStorage.setItem('r_v85', room);
                dbRef = firebase.database().ref('pad_v85/' + room);
                
                safeText('cloud-status', "Prijungta"); safeClass('cloud-status', "text-[10px] bg-green-500 px-2 py-1 rounded font-bold text-white shadow-lg");
                safeClass('cloud-connect-ui', "hidden space-y-4 text-center"); safeClass('cloud-active-ui', "space-y-4 text-center");
                safeText('cloud-room-name-display', room);

                dbRef.once('value').then(snap => {
                    const d = snap.val();
                    if (d) {
                        players = d.players || []; matches = d.matches || []; settings = {...ds, ...(d.settings || {})};
                        savedTournaments = d.savedTournaments || []; currentTid = d.currentTid || null;
                        render();
                    } else { autoSave(); }
                    
                    dbRef.on('value', snap2 => {
                        const d2 = snap2.val(); 
                        if(d2 && (JSON.stringify(d2.lastUpdate) !== JSON.stringify(window.lastCloudUpdate))) {
                            window.lastCloudUpdate = d2.lastUpdate;
                            players = d2.players || []; matches = d2.matches || []; settings = {...ds, ...(d2.settings || {})};
                            savedTournaments = d2.savedTournaments || []; currentTid = d2.currentTid || null;
                            setStore('p', players); setStore('m', matches); setStore('s', settings); setStore('h', savedTournaments); setStore('tid', currentTid);
                            render();
                            const sb = el('sync-bar'); if(sb) { sb.style.width = "100%"; setTimeout(() => sb.style.width = "0", 400); }
                        }
                    });
                });
            } catch(e) { console.error(e); showError("Cloud Error"); }
        }

        function disconnectFirebase() { 
            if(dbRef) dbRef.off(); isCloud = false; dbRef = null; activeRoom = ''; localStorage.removeItem('r_v85'); 
            safeClass('cloud-connect-ui', "space-y-4 text-center"); safeClass('cloud-active-ui', "hidden space-y-4 text-center"); 
            safeText('cloud-status', "Atsijungta"); safeClass('cloud-status', "text-[10px] bg-slate-700 px-2 py-1 rounded font-bold text-slate-300"); 
            loadData(); render();
        }

        render();
    </script>
</body>
</html>
