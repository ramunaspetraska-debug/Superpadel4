<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Padelio PRO V70 (Rainbow Logic)</title>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>

    <style>
        body { background-color: #f8fafc; font-family: -apple-system, system-ui, sans-serif; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; padding-bottom: 90px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .nav-btn.active { color: #16a34a; }
        .nav-btn.active svg { stroke: #16a34a; }
        .nav-btn { color: #94a3b8; transition: all 0.2s; }
        .view-section { display: none; }
        .view-section.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .avatar-frame-m { border: 2px solid #3b82f6; }
        .avatar-frame-f { border: 2px solid #ec4899; }
        input, select { font-size: 16px !important; }
        .stat-col { text-align: center; font-weight: bold; font-size: 10px; width: 22px; flex-shrink: 0; }
        .stat-col-wide { text-align: right; font-weight: 900; font-size: 12px; width: 42px; flex-shrink: 0; }
    </style>
</head>
<body>

    <div id="sync-status" class="fixed top-0 left-0 w-full h-1 bg-gray-200 z-[60]"><div id="sync-bar" class="h-full bg-green-500 w-0 transition-all duration-500"></div></div>

            <button type="button" onclick="adjustTime(-60)" class="w-10 h-10 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center active:bg-slate-200 text-xl font-bold">-</button>
            <span id="timer-display" class="text-3xl font-black font-mono tracking-tighter tabular-nums">12:00</span>
            <button type="button" onclick="adjustTime(60)" class="w-10 h-10 rounded-full bg-slate-100 text-slate-700 flex items-center justify-center active:bg-slate-200 text-xl font-bold">+</button>
        </div>
        <div id="score-mode-text" class="hidden text-sm font-black text-slate-500 uppercase tracking-widest text-center w-full">IKI TAŠKŲ</div>
        <div class="flex items-center gap-2">
            <button type="button" id="btn-play" onclick="toggleTimer()" class="w-10 h-10 rounded-full bg-green-600 text-white shadow-lg flex items-center justify-center active:scale-95">

                <svg id="icon-pause" class="hidden" width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                <svg id="icon-stop" class="hidden" width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" /></svg>
            </button>
            <button type="button" onclick="resetTimer()" class="w-10 h-10 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center active:scale-95">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            </button>
        </div>
    </div>

    <div class="max-w-md mx-auto p-4 w-full">
        
        <div id="view-setup" class="view-section active w-full">

                <input type="text" id="fb-apiKey" value="AIzaSyC_Z6srTcBfOWjG0aUKIoLD74ucozLUBHc" class="hidden">

        <div class="flex justify-between items-center h-16 max-w-md mx-auto px-1">
            <button onclick="switchView('setup')" id="nav-setup" class="nav-btn active flex flex-col items-center w-[16%]"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l-.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l-.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg><span class="text-[8px] font-bold mt-1 uppercase">Setup</span></button>
            <button onclick="switchView('matches')" id="nav-matches" class="nav-btn flex flex-col items-center w-[16%]"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m4.93 4.93 14.14 14.14"/></svg><span class="text-[8px] font-bold mt-1 uppercase">Mačai</span></button>
            <button onclick="switchView('leader')" id="nav-leader" class="nav-btn flex flex-col items-center w-[16%]"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg><span class="text-[8px] font-bold mt-1 uppercase">Lentelė</span></button>
            <button onclick="switchView('stats')" id="nav-stats" class="nav-btn flex flex-col items-center w-[16%]"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg><span class="text-[8px] font-bold mt-1 uppercase">Stats</span></button>

    <script>
        // --- HELPERS ---
        function el(id) { return document.getElementById(id); }
        function safeText(id, t) { const e = el(id); if(e) e.innerText = t; }
        function safeHTML(id, h) { const e = el(id); if(e) e.innerHTML = h; }
        function safeVal(id, v) { const e = el(id); if(e) e.value = v; }
        function safeClass(id, c) { const e = el(id); if(e) e.className = c; }
        function safeDisplay(id, d) { const e = el(id); if(e) e.style.display = d; }
        function showError(msg) { console.error(msg); alert(msg); }

        // --- STATE ---
        const ds = { matchDuration: 12, maxPoints: 21, courts: 2, winCondition: 'time', format: 'americano', rankingMode: 'points' };
        let players = [], matches = [], savedTournaments = [], settings = {...ds}, currentTid = null, curPh = null;
        let tempGender = 'M', timeLeft = 0, timerInterval, alarmInterval, isRunning = false, endTime = 0, dbRef = null, isCloud = false;

        function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

        // --- RAINBOW STARTERS (100% UNIQUE) ---
        const WHIST = {
            4: { mod: 3, pivot: 4, starter: [[4, 1, 2, 3]] },
            8: { mod: 7, pivot: 8, starter: [[8, 7, 1, 6], [2, 5, 3, 4]] },
            12: { mod: 11, pivot: 12, starter: [[12, 11, 1, 10], [2, 9, 3, 8], [4, 7, 5, 6]] },
            16: { mod: 15, pivot: 16, starter: [[16, 15, 1, 14], [2, 13, 3, 12], [4, 11, 5, 10], [6, 9, 7, 8]] },
            20: { mod: 19, pivot: 20, starter: [[20, 19, 1, 18], [2, 17, 3, 16], [4, 15, 5, 14], [6, 13, 7, 12], [8, 11, 9, 10]] }
        };

        // --- INIT ---
        try {
            players = (JSON.parse(localStorage.getItem('p_v70')) || []).filter(p => p && p.id);
            matches = JSON.parse(localStorage.getItem('m_v70')) || [];
            settings = {...ds, ...(JSON.parse(localStorage.getItem('s_v70')) || {})};
            savedTournaments = JSON.parse(localStorage.getItem('h_v70')) || [];
            currentTid = localStorage.getItem('tid_v70');
            timeLeft = settings.matchDuration * 60;
            const r = localStorage.getItem('r_v70');
            if(r) { safeVal('fb-room', r); initFirebaseConnection(true); }
        } catch(e) { console.error("Init Error", e); localStorage.clear(); }

        // --- BRAINS ---
        function getPartnerHistory() {
            const h = new Map();
            const allM = [...(savedTournaments || []).map(t=>t.matches).flat(), ...matches];
            allM.forEach(m => {
                if(m && m.team1 && m.team2) {
                    const add = (p1, p2) => {
                        if(p1 && p2) {
                            if(!h.has(p1.id)) h.set(p1.id, new Map());
                            const m1 = h.get(p1.id); m1.set(p2.id, (m1.get(p2.id) || 0) + 1);
                        }
                    };
                    if(m.team1.length > 1) { add(m.team1[0], m.team1[1]); add(m.team1[1], m.team1[0]); }
                    if(m.team2.length > 1) { add(m.team2[0], m.team2[1]); add(m.team2[1], m.team2[0]); }
                }
            });
            return h;
        }

        function calculateBalanceCost(prop) {
            const stats = new Map();
            players.forEach(p => stats.set(p.id, new Map()));
            prop.forEach(m => {
                m.team1.forEach(p1 => m.team2.forEach(p2 => {
                    const m1 = stats.get(p1.id); if(m1) m1.set(p2.id, (m1.get(p2.id)||0)+1);
                    const m2 = stats.get(p2.id); if(m2) m2.set(p1.id, (m2.get(p1.id)||0)+1);
                }));
            });
            let cost = 0;
            for(const [_, m] of stats) for(const [_, c] of m) cost += (c * c);
            return cost;
        }

        function generateRound() {
            try {
                if(players.length < 4) return alert("Min 4 žaidėjai!");
                const safePool = players.filter(p => p && p.id);
                let newM = [], roundNum = (matches.length > 0 ? (matches[matches.length-1].round || 0) : 0) + 1;
                
                // RAINBOW WHIST GENERATOR
                if (settings.format === 'americano' && WHIST[safePool.length]) {
                    const N = safePool.length;
                    const cfg = WHIST[N];
                    const shift = roundNum - 1;
                    
                    if (N === 4) {
                        const m4 = [[[0,1],[2,3]], [[0,2],[1,3]], [[0,3],[1,2]]];
                        const c = shift % 3;
                        newM.push({ id: uid(), round: roundNum, court: 1, finished: false, score1:0, score2:0, team1: [safePool[m4[c][0][0]], safePool[m4[c][0][1]]], team2: [safePool[m4[c][1][0]], safePool[m4[c][1][1]]] });
                    } else {
                        const unmapIdx = (val) => val - 1;
                        cfg.starter.forEach((table, tIdx) => {
                            const pIndices = table.map(starterVal => {
                                if (starterVal === cfg.pivot) return cfg.pivot;
                                let newVal = (starterVal + shift) % cfg.mod;
                                if (newVal === 0) newVal = cfg.mod; 
                                return newVal;
                            });
                            newM.push({
                                id: uid(), round: roundNum, court: tIdx + 1, finished: false, score1: 0, score2: 0,
                                team1: [safePool[unmapIdx(pIndices[0])], safePool[unmapIdx(pIndices[1])]],
                                team2: [safePool[unmapIdx(pIndices[2])], safePool[unmapIdx(pIndices[3])]]
                            });
                        });
                    }
                    matches = [...matches, ...newM]; autoSave(); switchView('matches');
                    return;
                }

                // FALLBACK MONTE CARLO
                const hist = getPartnerHistory();
                let bestSet = null, minScore = Infinity;

                for(let i=0; i<1000; i++) {
                    let pool = [...safePool].sort(() => Math.random() - 0.5);
                    let currentSet = [], currentScore = 0;
                    
                    if(settings.format.includes('mix')) {
                        let m = pool.filter(p=>p.gender==='M'), f = pool.filter(p=>p.gender==='F');
                        let pairs = Math.min(Math.floor(m.length), Math.floor(f.length));
                        let courtsNeeded = Math.min(settings.courts, Math.floor(pairs/2));
                        
                        if(courtsNeeded > 0) {
                            for(let c=0; c<courtsNeeded; c++) {
                                const t1 = [m.pop(), f.pop()], t2 = [m.pop(), f.pop()];
                                if(t1[0] && t1[1] && t2[0] && t2[1]) {
                                    currentScore += (hist.get(t1[0].id)?.get(t1[1].id) || 0) * 10;
                                    currentScore += (hist.get(t2[0].id)?.get(t2[1].id) || 0) * 10;
                                    currentSet.push({ team1: t1, team2: t2 });
                                }
                            }
                        }
                    } else if(settings.format === 'fixed') {
                        let teams = []; for(let k=0; k<pool.length; k+=2) if(k+1 < pool.length) teams.push([pool[k], pool[k+1]]);
                        let courtsNeeded = Math.min(settings.courts, Math.floor(teams.length/2));
                        for(let c=0; c<courtsNeeded; c++) currentSet.push({ team1: teams.pop(), team2: teams.pop() });
                    } else {
                        let courtsNeeded = Math.min(settings.courts, Math.floor(pool.length/4));
                        for(let c=0; c<courtsNeeded; c++) {
                            const t1 = [pool.pop(), pool.pop()], t2 = [pool.pop(), pool.pop()];
                            currentScore += (hist.get(t1[0].id)?.get(t1[1].id) || 0) * 10;
                            currentScore += (hist.get(t2[0].id)?.get(t2[1].id) || 0) * 10;
                            currentSet.push({ team1: t1, team2: t2 });
                        }
                    }

                    if(currentSet.length > 0 && currentScore < minScore) { minScore = currentScore; bestSet = currentSet; if(minScore===0) break; }
                }

                if(!bestSet || bestSet.length === 0) {
                    let pool = [...safePool].sort(() => Math.random() - 0.5);
                    if(pool.length >= 4) bestSet = [{ team1: [pool.pop(), pool.pop()], team2: [pool.pop(), pool.pop()] }];
                }

                if(bestSet && bestSet.length > 0) {
                    bestSet.forEach((m, idx) => { newM.push({ id: uid(), round: roundNum, court: idx+1, finished: false, score1:0, score2:0, team1: m.team1, team2: m.team2 }); });
                    matches = [...matches, ...newM]; autoSave(); switchView('matches');
                } else {
                    alert("Nepakanka žaidėjų.");
                }
            } catch(e) { showError("Generavimo klaida: " + e.message); }
        }

                    savedTournaments.unshift({ id: currentTid, name: new Date().toLocaleDateString('lt-LT') + ' Turnyras', date: new Date().toISOString(), players: [], matches: [], settings: {} });
                }
                const idx = savedTournaments.findIndex(x => x.id === currentTid);

                }

                render();
            } catch (e) { showError("Klaida išsaugant: " + e.message); }
        }

        function calculateResults(mArr, pArr, isF = false) {
            let res = [];
            if(isF) { for(let i=0; i<pArr.length; i+=2) if(i+1 < pArr.length) res.push({ id: pArr[i].id+'_'+pArr[i+1].id, name: pArr[i].name+' / '+pArr[i+1].name, p1: pArr[i], p2: pArr[i+1], mp:0, w:0, t:0, l:0, sw:0, sl:0, dif:0, lp:0 }); }
            else { res = pArr.map(p => ({ ...p, mp:0, w:0, t:0, l:0, sw:0, sl:0, dif:0, lp:0 })); }
            
            mArr.filter(m => m.finished).forEach(m => {
                if(!m.team1 || !m.team2) return;
                const up = (team, myS, enS) => {
                    let targets = isF ? [res.find(r => r.p1.id === team[0].id || r.p2.id === team[0].id)] : team.map(p => res.find(r => r.id === p.id));
                    targets.forEach(s => { if(!s) return; s.mp++; s.sw += myS; s.sl += enS; s.dif = s.sw - s.sl; if(myS > enS) { s.w++; s.lp += 2; } else if(myS < enS) s.l++; else { s.t++; s.lp += 1; } });
                };
                up(m.team1, m.score1, m.score2); up(m.team2, m.score2, m.score1);
            });
            return res.sort((a,b) => settings.rankingMode === 'wins' ? (b.lp - a.lp || b.dif - a.dif) : (b.sw - a.sw || b.dif - a.dif));
        }

            try {
                if(!firebase.apps.length) firebase.initializeApp(config);
                dbRef = firebase.database().ref('pad_v70/' + room); isCloud = true; localStorage.setItem('r_v70', room);
                safeText('cloud-status', "Prijungta"); safeClass('cloud-status', "text-[10px] bg-green-500 px-2 py-1 rounded font-bold text-white shadow-lg");
                safeClass('cloud-connect-ui', "hidden space-y-4 text-center"); safeClass('cloud-active-ui', "space-y-4 text-center");
                safeText('cloud-room-name-display', room);
                dbRef.on('value', snap => {
                    const d = snap.val(); if(d && (JSON.stringify(d.players) !== JSON.stringify(players) || JSON.stringify(d.matches) !== JSON.stringify(matches))) {
                        players = d.players || []; matches = d.matches || []; settings = {...ds, ...d.settings}; render();
                        const sb = el('sync-bar'); if(sb) { sb.style.width = "100%"; setTimeout(() => sb.style.width = "0", 400); }
                    }
                });
            } catch(e) { console.error(e); showError("Cloud Error"); }
        }
        function disconnectFirebase() { if(dbRef) dbRef.off(); isCloud = false; dbRef = null; localStorage.removeItem('r_v70'); safeClass('cloud-connect-ui', "space-y-4 text-center"); safeClass('cloud-active-ui', "hidden space-y-4 text-center"); safeText('cloud-status', "Atsijungta"); safeClass('cloud-status', "text-[10px] bg-slate-700 px-2 py-1 rounded font-bold text-slate-300"); }

        render();
    </script>
</body>
