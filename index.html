<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Padelio PRO V43 (12 Player Smart Mix)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background-color: #f8fafc; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            -webkit-tap-highlight-color: transparent; 
            overscroll-behavior-y: none;
            overflow-x: hidden; 
            width: 100vw;
            margin: 0;
            padding-bottom: 90px;
        }
        input, select, button { font-size: 16px !important; touch-action: manipulation; } 
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .nav-btn.active { color: #16a34a; }
        .nav-btn.active svg { stroke: #16a34a; }
        .nav-btn { color: #94a3b8; transition: all 0.2s; }
        
        .view-section { display: none; }
        .view-section.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        @keyframes pulse-red {
            0%, 100% { background-color: #ef4444; transform: scale(1); }
            50% { background-color: #dc2626; transform: scale(1.1); }
        }
        .alarm-active {
            animation: pulse-red 1s infinite;
        }
    </style>
</head>
<body>

    <div id="error-box" style="display:none; position:fixed; top:0; left:0; width:100%; background:red; color:white; padding:20px; z-index:9999; font-size:12px;"></div>

    <div id="top-bar" class="sticky top-0 z-50 bg-white border-b border-slate-200 shadow-sm h-16 flex justify-between items-center px-4 w-full">
        <div class="flex items-center gap-2" id="timer-controls">
            <button type="button" onclick="adjustTime(-60)" class="w-10 h-10 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center active:bg-slate-200 text-xl font-bold">-</button>
            <span id="timer-display" class="text-3xl font-black font-mono tracking-wider tabular-nums select-none">12:00</span>
            <button type="button" onclick="adjustTime(60)" class="w-10 h-10 rounded-full bg-slate-100 text-slate-700 flex items-center justify-center active:bg-slate-200 text-xl font-bold">+</button>
        </div>
        <div id="score-mode-text" class="hidden text-sm font-bold text-slate-500 uppercase tracking-widest text-center w-full">
            IKI TAŠKŲ
        </div>
        <div class="flex items-center gap-3">
            <button type="button" id="btn-play" onclick="toggleTimer()" class="w-12 h-12 rounded-full bg-green-600 text-white shadow-lg shadow-green-600/30 flex items-center justify-center active:scale-95 transition-transform relative">
                <svg id="icon-play" width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <svg id="icon-pause" class="hidden" width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                <svg id="icon-stop" class="hidden" width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" /></svg>
            </button>
            
            <button type="button" onclick="resetTimer()" class="w-12 h-12 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center active:scale-95">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            </button>
        </div>
    </div>

    <div class="max-w-md mx-auto p-4 w-full">
        
        <div id="view-setup" class="view-section active w-full">
            <div class="bg-white p-3 pr-4 rounded-2xl shadow-lg shadow-slate-200/50 border border-slate-200 mb-6 sticky top-20 z-10 w-full">
                <div class="flex justify-between items-center mb-2">
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-wide">Naujas Žaidėjas</label>
                    <span id="player-count" class="bg-slate-100 text-slate-600 text-[10px] px-2 py-1 rounded-full font-bold">Viso: 0</span>
                </div>
                <form id="add-player-form" class="flex gap-2 w-full">
                    <div class="flex bg-slate-100 rounded-xl overflow-hidden shrink-0 h-14 border border-slate-200">
                        <button type="button" id="gender-m" onclick="setGender('M')" class="px-3 font-bold transition-colors text-lg bg-blue-600 text-white">V</button>
                        <button type="button" id="gender-f" onclick="setGender('F')" class="px-3 font-bold transition-colors text-lg text-slate-400">M</button>
                    </div>
                    <input type="text" id="input-name" placeholder="Vardas..." class="flex-1 min-w-0 px-3 rounded-xl border-2 border-slate-200 focus:outline-none focus:border-green-500 h-14 text-slate-900 font-bold text-lg" autocomplete="off" />
                    <button type="submit" class="bg-slate-900 text-white w-14 h-14 shrink-0 rounded-xl font-bold text-3xl shadow-lg active:scale-95">+</button>
                </form>
            </div>

            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 mb-6 space-y-4 w-full">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest border-b border-slate-100 pb-2">Nustatymai</h3>
                
                <div class="flex bg-slate-100 p-1 rounded-lg">
                    <button type="button" id="mode-time" onclick="setMode('time')" class="flex-1 py-2 text-sm font-bold rounded-md bg-white shadow text-slate-900 transition-all">Pagal Laiką</button>
                    <button type="button" id="mode-score" onclick="setMode('score')" class="flex-1 py-2 text-sm font-bold rounded-md text-slate-400 transition-all">Pagal Taškus</button>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div id="control-duration">
                        <label class="text-[10px] font-bold text-slate-500 uppercase block mb-1">Laikas (min)</label>
                        <div class="flex items-center gap-2 h-[42px]">
                            <button type="button" onclick="changeSetting('matchDuration', -1)" class="w-10 h-full bg-slate-100 rounded font-bold text-slate-600 active:bg-slate-200 text-xl">-</button>
                            <span id="val-duration" class="flex-1 text-center font-black text-xl text-slate-800">12</span>
                            <button type="button" onclick="changeSetting('matchDuration', 1)" class="w-10 h-full bg-slate-100 rounded font-bold text-slate-600 active:bg-slate-200 text-xl">+</button>
                        </div>
                    </div>
                     <div id="control-points" style="display:none;">
                        <label class="text-[10px] font-bold text-slate-500 uppercase block mb-1">Iki taškų</label>
                        <div class="flex items-center gap-2 h-[42px]">
                            <button type="button" onclick="changeSetting('maxPoints', -1)" class="w-10 h-full bg-slate-100 rounded font-bold text-slate-600 active:bg-slate-200 text-xl">-</button>
                            <span id="val-points" class="flex-1 text-center font-black text-xl text-slate-800">21</span>
                            <button type="button" onclick="changeSetting('maxPoints', 1)" class="w-10 h-full bg-slate-100 rounded font-bold text-slate-600 active:bg-slate-200 text-xl">+</button>
                        </div>
                    </div>

                    <div>
                        <label class="text-[10px] font-bold text-slate-500 uppercase block mb-1">Aikštelės</label>
                        <div class="flex items-center gap-2 h-[42px]">
                            <button type="button" onclick="changeSetting('courts', -1)" class="w-10 h-full bg-slate-100 rounded font-bold text-slate-600 active:bg-slate-200 text-xl">-</button>
                            <span id="val-courts" class="flex-1 text-center font-black text-xl text-slate-800">2</span>
                            <button type="button" onclick="changeSetting('courts', 1)" class="w-10 h-full bg-slate-100 rounded font-bold text-slate-600 active:bg-slate-200 text-xl">+</button>
                        </div>
                    </div>
                </div>

                <div>
                     <label class="text-[10px] font-bold text-slate-500 uppercase block mb-1">Formatas</label>
                     <select id="select-format" onchange="changeFormat(this.value)" class="w-full bg-slate-50 border border-slate-200 rounded-lg py-3 px-3 font-bold text-slate-900 text-sm">
                        <option value="americano">Americano</option>
                        <option value="fixed">Fiksuotos Poros (2vs2)</option>
                        <option value="mexicano">Mexicano</option>
                        <option value="super_mexicano">Super Mexicano (Stipriausi vs Stipriausi)</option>
                        <option value="mix_americano">Mix Americano (Vyras + Moteris)</option>
                        <option value="mix_mexicano">Mix Mexicano (V+M pagal lygį)</option>
                    </select>
                     <div id="fixed-info" class="hidden text-[10px] text-slate-400 mt-1 italic text-center">
                        Poros sudaromos pagal sąrašą: 1+2, 3+4, 5+6 ir t.t.
                    </div>
                </div>

                <div>
                    <label class="text-[10px] font-bold text-slate-500 uppercase block mb-1">Reitingavimas</label>
                    <select id="select-ranking" onchange="changeRanking(this.value)" class="w-full bg-slate-50 border border-slate-200 rounded-lg py-3 px-3 font-bold text-slate-900 text-sm">
                       <option value="points">Pagal TAŠKUS (Americano)</option>
                       <option value="wins">Pagal PERGALES (W=2 / D=1)</option>
                   </select>
               </div>
            </div>

            <div id="players-list" class="space-y-2 mb-10 w-full"></div>

            <div class="space-y-3 pt-4 border-t border-slate-200 w-full pb-10">
                <button type="button" onclick="resetScores()" class="w-full py-4 text-orange-600 bg-white hover:bg-orange-50 rounded-xl font-bold text-xs uppercase tracking-wider border border-orange-200">Anuliuoti rezultatus</button>
                <button type="button" onclick="resetAll()" class="w-full py-4 text-red-600 bg-white hover:bg-red-50 rounded-xl font-bold text-xs uppercase tracking-wider border border-red-200">Ištrinti viską</button>
            </div>
        </div>

        <div id="view-matches" class="view-section w-full">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-black text-slate-800 tracking-tight">Mačai</h2>
                <button type="button" onclick="generateRound()" class="px-6 py-3 rounded-full bg-green-600 text-white font-bold shadow-lg text-sm active:scale-95 transition-transform flex items-center gap-2">
                    <span>+</span> Naujas
                </button>
            </div>
            <div id="matches-container"></div>
            <div id="finished-matches-container" class="mt-12 opacity-90"></div>
        </div>

        <div id="view-leader" class="view-section w-full">
            <h2 class="text-2xl font-black mb-6 text-slate-800 tracking-tight">Rezultatai</h2>
            
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden w-full">
                 <div id="leaderboard-header" class="flex items-center bg-slate-50 border-b border-slate-200 px-3 py-2 text-[10px] font-bold text-slate-400 uppercase tracking-wider text-center">
                    </div>
                <div id="leaderboard-body" class="divide-y divide-slate-100">
                    </div>
            </div>
        </div>
    </div>

    <div class="fixed bottom-0 left-0 w-full bg-white border-t border-slate-200 z-50 pb-safe shadow-[0_-5px_15px_rgba(0,0,0,0.05)]">
        <div class="flex justify-around items-center h-16 max-w-md mx-auto">
            <button type="button" onclick="switchView('setup')" id="nav-setup" class="nav-btn active flex flex-col items-center w-full py-1 active:scale-95">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l-.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l-.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
                <span class="text-[10px] font-bold mt-1">Nustatymai</span>
            </button>
            <button type="button" onclick="switchView('matches')" id="nav-matches" class="nav-btn flex flex-col items-center w-full py-1 active:scale-95">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m4.93 4.93 14.14 14.14"/></svg>
                <span class="text-[10px] font-bold mt-1">Žaidimas</span>
            </button>
            <button type="button" onclick="switchView('leader')" id="nav-leader" class="nav-btn flex flex-col items-center w-full py-1 active:scale-95">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
                <span class="text-[10px] font-bold mt-1">Rezultatai</span>
            </button>
        </div>
    </div>

    <script>
        window.onerror = function(msg, url, line) {
            const el = document.getElementById('error-box');
            el.style.display = 'block';
            el.innerHTML = "Klaida: " + msg + "<br>Eilutė: " + line + "<br>Prašau atnaujinti puslapį.";
            return false;
        };

        // --- GLOBALŪS KINTAMIEJI ---
        let players = [];
        let matches = [];
        let settings = { matchDuration: 12, maxPoints: 21, courts: 2, winCondition: 'time', format: 'americano', rankingMode: 'points' };
        
        let tempGender = 'M';
        let timeLeft = 0;
        let timerInterval = null;
        let alarmInterval = null;
        let isRunning = false;

        function uid() {
            return Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
        }

        // --- INIT ---
        try {
            // V43 RAKTAS (12 Player Mix Fix)
            players = JSON.parse(localStorage.getItem('padel_players_v43')) || [];
            matches = JSON.parse(localStorage.getItem('padel_matches_v43')) || [];
            const savedSettings = JSON.parse(localStorage.getItem('padel_settings_v43'));
            if (savedSettings) settings = { ...settings, ...savedSettings };
            timeLeft = settings.matchDuration * 60;
        } catch (e) {
            console.error("Duomenų klaida, valoma...", e);
            localStorage.clear();
        }

        // --- FUNKCIJOS ---
        function saveData() {
            localStorage.setItem('padel_players_v43', JSON.stringify(players));
            localStorage.setItem('padel_matches_v43', JSON.stringify(matches));
            localStorage.setItem('padel_settings_v43', JSON.stringify(settings));
            render();
        }

        function switchView(viewName) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            document.getElementById('view-' + viewName).classList.add('active');
            document.getElementById('nav-' + viewName).classList.add('active');
            if (viewName === 'leader') updateLeaderboard();
        }

        function updateTimerDisplay() {
            if (settings.winCondition === 'score') {
                document.getElementById('timer-controls').style.display = 'none';
                document.getElementById('score-mode-text').innerHTML = `IKI ${settings.maxPoints} TAŠKŲ`;
                document.getElementById('score-mode-text').style.display = 'block';
                return;
            }
            document.getElementById('score-mode-text').style.display = 'none';
            document.getElementById('timer-controls').style.display = 'flex';
            
            const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            const s = (timeLeft % 60).toString().padStart(2, '0');
            document.getElementById('timer-display').textContent = `${m}:${s}`;
            
            const topBar = document.getElementById('top-bar');
            if (timeLeft === 0) {
                topBar.classList.add('bg-red-500', 'text-white');
                topBar.classList.remove('bg-white');
            } else {
                topBar.classList.remove('bg-red-500', 'text-white');
                topBar.classList.add('bg-white');
            }
        }

        // --- TIMER & ALARM ---
        function updatePlayButtonUI() {
            const btn = document.getElementById('btn-play');
            const iconPlay = document.getElementById('icon-play');
            const iconPause = document.getElementById('icon-pause');
            const iconStop = document.getElementById('icon-stop');

            btn.classList.remove('animate-pulse', 'bg-orange-100', 'text-orange-600', 'bg-green-600', 'text-white', 'alarm-active', 'bg-red-600');
            iconPlay.classList.add('hidden');
            iconPause.classList.add('hidden');
            iconStop.classList.add('hidden');

            if (alarmInterval) {
                btn.classList.add('bg-red-600', 'text-white', 'alarm-active');
                iconStop.classList.remove('hidden');
            } else if (isRunning) {
                btn.classList.add('bg-orange-100', 'text-orange-600');
                iconPause.classList.remove('hidden');
            } else {
                btn.classList.add('bg-green-600', 'text-white');
                iconPlay.classList.remove('hidden');
            }
        }

        function toggleTimer() {
            if (settings.winCondition === 'score') return;

            if (alarmInterval) {
                stopAlarm();
                resetTimer(); 
                return;
            }

            if (isRunning) {
                clearInterval(timerInterval);
                timerInterval = null;
                isRunning = false;
                updatePlayButtonUI();
            } else {
                if (timeLeft <= 0) return;
                isRunning = true;
                updatePlayButtonUI();
                
                timerInterval = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        updateTimerDisplay();
                    } else {
                        clearInterval(timerInterval);
                        timerInterval = null;
                        isRunning = false;
                        triggerAlarm();
                    }
                }, 1000);
            }
        }

        function triggerAlarm() {
            if (alarmInterval) return;
            updateTimerDisplay();
            playWhistle();
            alarmInterval = setInterval(() => {
                playWhistle();
            }, 3000);
            updatePlayButtonUI();
        }

        function stopAlarm() {
            if (alarmInterval) {
                clearInterval(alarmInterval);
                alarmInterval = null;
                updatePlayButtonUI();
            }
        }

        function resetTimer() {
            stopAlarm();
            if (isRunning) {
                clearInterval(timerInterval);
                timerInterval = null;
                isRunning = false;
            }
            timeLeft = settings.matchDuration * 60;
            updateTimerDisplay();
            updatePlayButtonUI();
        }

        function adjustTime(sec) {
            if (settings.winCondition === 'score') return;
            if (isRunning || alarmInterval) return; 
            timeLeft = Math.max(0, timeLeft + sec);
            updateTimerDisplay();
        }

        function playWhistle() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.connect(gain); 
                gain.connect(ctx.destination);
                
                osc.type = 'triangle';
                const now = ctx.currentTime;
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.linearRampToValueAtTime(1500, now + 0.3);
                osc.frequency.linearRampToValueAtTime(800, now + 2.5);
                
                gain.gain.setValueAtTime(0.5, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 2.5);
                
                osc.start(); 
                osc.stop(now + 2.5);
                
                if(navigator.vibrate) navigator.vibrate([500, 200, 500]);
            } catch(e) {}
        }

        // --- SETUP ---
        document.getElementById('add-player-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const input = document.getElementById('input-name');
            const name = input.value.trim();
            if (!name) return;
            players.push({ id: uid(), name: name, gender: tempGender });
            input.value = '';
            saveData();
        });

        function setGender(g) {
            tempGender = g;
            const btnM = document.getElementById('gender-m');
            const btnF = document.getElementById('gender-f');
            if (g === 'M') {
                btnM.className = 'px-3 font-bold transition-colors text-lg bg-blue-600 text-white';
                btnF.className = 'px-3 font-bold transition-colors text-lg text-slate-400';
            } else {
                btnM.className = 'px-3 font-bold transition-colors text-lg text-slate-400';
                btnF.className = 'px-3 font-bold transition-colors text-lg bg-pink-500 text-white';
            }
        }

        function removePlayer(id) {
            if (confirm('Ištrinti žaidėją?')) {
                players = players.filter(p => p.id !== id);
                saveData();
            }
        }

        function setMode(mode) {
            resetTimer(); 
            settings.winCondition = mode;
            saveData();
            render(); 
        }

        function changeSetting(key, val) {
            settings[key] = Math.max(1, settings[key] + val);
            saveData();
            if (key === 'matchDuration') resetTimer();
        }
        
        function changeFormat(val) {
            settings.format = val;
            saveData();
            document.getElementById('fixed-info').style.display = (val === 'fixed') ? 'block' : 'none';
            updateLeaderboard(); 
        }

        function changeRanking(val) {
            settings.rankingMode = val;
            saveData();
            updateLeaderboard(); 
        }

        function resetScores() { 
            if(confirm('Tikrai anuliuoti rezultatus?')) { 
                matches = []; 
                saveData(); 
            } 
        }
        function resetAll() { 
            if(confirm('Viskas bus ištrinta!')) { 
                localStorage.clear(); 
                location.reload(); 
            } 
        }

        // --- STATS & HISTORY (INDIVIDUAL) ---
        function getLeaderboardStats() {
            const stats = players.map(p => ({
                ...p,
                mp: 0, w: 0, d: 0, l: 0, setWon: 0, setLost: 0, pts: 0, diff: 0, leaguePts: 0
            }));

            matches.filter(m => m.finished).forEach(m => {
                const processTeam = (teamArr, myScore, enScore) => {
                    teamArr.forEach(p => {
                        const s = stats.find(x => x.id === p.id);
                        if (!s) return;
                        s.mp += 1;
                        s.setWon += myScore;
                        s.setLost += enScore;
                        s.diff = s.setWon - s.setLost;
                        if (myScore > enScore) { s.w += 1; s.leaguePts += 2; } 
                        else if (myScore < enScore) { s.l += 1; } 
                        else { s.d += 1; s.leaguePts += 1; }
                    });
                };
                processTeam(m.team1, m.score1, m.score2);
                processTeam(m.team2, m.score2, m.score1);
            });

            return sortStats(stats);
        }

        // --- STATS (FIXED TEAMS) ---
        function getFixedTeamStats() {
            let teams = [];
            for (let i = 0; i < players.length; i += 2) {
                if (i + 1 < players.length) {
                    teams.push({
                        p1: players[i],
                        p2: players[i+1],
                        id: players[i].id + '_' + players[i+1].id,
                        name: players[i].name + ' / ' + players[i+1].name,
                        gender: 'TEAM',
                        mp: 0, w: 0, d: 0, l: 0, setWon: 0, setLost: 0, pts: 0, diff: 0, leaguePts: 0
                    });
                }
            }

            matches.filter(m => m.finished).forEach(m => {
                const getTeamByPlayerId = (pid) => teams.find(t => t.p1.id === pid || t.p2.id === pid);
                const t1 = getTeamByPlayerId(m.team1[0].id);
                const t2 = getTeamByPlayerId(m.team2[0].id);

                const updateT = (t, myS, enS) => {
                    if(!t) return;
                    t.mp++;
                    t.setWon += myS;
                    t.setLost += enS;
                    t.diff = t.setWon - t.setLost;
                    if(myS > enS) { t.w++; t.leaguePts += 2; }
                    else if(myS < enS) { t.l++; }
                    else { t.d++; t.leaguePts += 1; }
                };

                updateT(t1, m.score1, m.score2);
                updateT(t2, m.score2, m.score1);
            });

            return sortStats(teams);
        }

        function sortStats(data) {
             return data.sort((a,b) => {
                if (settings.rankingMode === 'wins') {
                    if (b.leaguePts !== a.leaguePts) return b.leaguePts - a.leaguePts;
                    if (b.diff !== a.diff) return b.diff - a.diff;
                    return b.setWon - a.setWon;
                } else {
                    if (b.setWon !== a.setWon) return b.setWon - a.setWon;
                    if (b.diff !== a.diff) return b.diff - a.diff;
                    return b.w - a.w;
                }
            });
        }

        // --- HISTORY & BALANCE UTILS ---
        function getPartnerHistory() {
            const history = new Map(); 
            matches.forEach(m => { 
                const addPair = (p1, p2) => {
                    if (!history.has(p1.id)) history.set(p1.id, new Set());
                    if (!history.has(p2.id)) history.set(p2.id, new Set());
                    history.get(p1.id).add(p2.id);
                    history.get(p2.id).add(p1.id);
                };
                addPair(m.team1[0], m.team1[1]);
                addPair(m.team2[0], m.team2[1]);
            });
            return history;
        }

        function getTeamVsTeamCount(tA, tB) {
            let count = 0;
            matches.forEach(m => {
                const team1Ids = m.team1.map(p => p.id);
                const team2Ids = m.team2.map(p => p.id);
                const pA1 = tA[0].id, pA2 = tA[1].id;
                const pB1 = tB[0].id, pB2 = tB[1].id;

                if ((team1Ids.includes(pA1) || team1Ids.includes(pA2)) && (team2Ids.includes(pB1) || team2Ids.includes(pB2))) {
                    count++;
                }
                else if ((team1Ids.includes(pB1) || team1Ids.includes(pB2)) && (team2Ids.includes(pA1) || team2Ids.includes(pA2))) {
                    count++;
                }
            });
            return count;
        };

        function calculateGlobalBalanceCost(proposedMatches) {
            const stats = new Map();
            players.forEach(p => stats.set(p.id, new Map()));

            const increment = (p1Id, p2Id) => {
                if (p1Id === p2Id) return;
                const p1Map = stats.get(p1Id);
                p1Map.set(p2Id, (p1Map.get(p2Id) || 0) + 1);
                const p2Map = stats.get(p2Id);
                p2Map.set(p1Id, (p1Map.get(p2Id) || 0) + 1);
            };

            [...matches, ...proposedMatches].forEach(m => {
                m.team1.forEach(p1 => {
                    m.team2.forEach(p2 => {
                        increment(p1.id, p2.id);
                        increment(p2.id, p1.id);
                    });
                });
            });

            let totalCost = 0;
            for (const [pid, oppMap] of stats) {
                for (const [oid, count] of oppMap) {
                    totalCost += (count * count); 
                }
            }
            return totalCost;
        }

        // --- GENERAVIMO LOGIKA (V43 - UNIVERSAL MIX/AMERICANO BALANCER) ---
        function generateRound() {
            if (players.length < 4) return alert("Reikia bent 4 žaidėjų!");
            
            let newMatches = [];
            const round = matches.length > 0 ? (matches[matches.length-1].round || 0) + 1 : 1;
            const stats = getLeaderboardStats();
            const statsMap = new Map(stats.map(p => [p.id, p]));
            const history = getPartnerHistory();
            const hasPlayed = (p1, p2) => history.has(p1.id) && history.get(p1.id).has(p2.id);

            // --- FIXED PAIRS LOGIC ---
            if (settings.format === 'fixed') {
               let teams = [];
                for (let i = 0; i < players.length; i += 2) {
                    if (i + 1 < players.length) teams.push([players[i], players[i+1]]);
                }
                
                // Sort by Matches Played (MP)
                const teamStats = new Map();
                teams.forEach(t => {
                    const id = t[0].id + '_' + t[1].id;
                    let played = 0;
                    matches.forEach(m => {
                        const mIds = [...m.team1.map(p=>p.id), ...m.team2.map(p=>p.id)];
                        if (mIds.includes(t[0].id) && mIds.includes(t[1].id)) played++;
                    });
                    teamStats.set(id, played);
                });
                
                teams.sort((a,b) => {
                    const mpA = teamStats.get(a[0].id + '_' + a[1].id) || 0;
                    const mpB = teamStats.get(b[0].id + '_' + b[1].id) || 0;
                    return mpA - mpB || Math.random() - 0.5;
                });

                let possibleMatchups = [];
                for (let i = 0; i < teams.length; i++) {
                    for (let j = i + 1; j < teams.length; j++) {
                        possibleMatchups.push({ 
                            t1: teams[i], t2: teams[j], 
                            played: getTeamVsTeamCount(teams[i], teams[j]),
                            r: Math.random() 
                        });
                    }
                }
                
                possibleMatchups.sort((a, b) => {
                    const mpA1 = teamStats.get(a.t1[0].id + '_' + a.t1[1].id);
                    const mpA2 = teamStats.get(a.t2[0].id + '_' + a.t2[1].id);
                    const mpB1 = teamStats.get(b.t1[0].id + '_' + b.t1[1].id);
                    const mpB2 = teamStats.get(b.t2[0].id + '_' + b.t2[1].id);
                    
                    if ((mpA1+mpA2) !== (mpB1+mpB2)) return (mpA1+mpA2) - (mpB1+mpB2);
                    if (a.played !== b.played) return a.played - b.played;
                    return a.r - b.r;
                });

                const usedTeams = new Set();
                for (const pm of possibleMatchups) {
                    if (newMatches.length >= settings.courts) break;
                    const t1ID = pm.t1[0].id;
                    const t2ID = pm.t2[0].id;
                    if (!usedTeams.has(t1ID) && !usedTeams.has(t2ID)) {
                        usedTeams.add(t1ID); usedTeams.add(t2ID);
                        newMatches.push({ id: uid(), round, court: newMatches.length + 1, finished: false, score1: 0, score2: 0, team1: pm.t1, team2: pm.t2 });
                    }
                }

            } else if (settings.format.includes('mix')) {
                // --- MIX SOLVER V43 ---
                let men = players.filter(p => p.gender === 'M');
                let women = players.filter(p => p.gender === 'F');

                // Sort by MP to prioritize resters
                men.sort((a,b) => (statsMap.get(a.id)?.mp || 0) - (statsMap.get(b.id)?.mp || 0));
                women.sort((a,b) => (statsMap.get(a.id)?.mp || 0) - (statsMap.get(b.id)?.mp || 0));

                if (settings.format === 'mix_americano') {
                    // Smart Solver for Mix (Supports 12 players/3 courts etc)
                    let bestSetup = null;
                    let minCost = Infinity;
                    const iterations = 3000;

                    for(let i=0; i<iterations; i++) {
                        // Weighted shuffle - Keep low MP players in front
                        // How many needed? 
                        const neededPairs = settings.courts * 2;
                        const available = Math.min(men.length, women.length);
                        
                        if (available < neededPairs) { 
                            // Not enough players for all courts? Just take all.
                        }

                        // We copy lists. The sort is stable for MP. 
                        // We slightly shuffle within same MP tiers? 
                        // Simple: shuffle complete list, but biased? 
                        // Actually, just full shuffle is robust enough with high iterations, 
                        // but to force rotation we need to pick low MP.
                        
                        // Strict selection: Take top N low-MP players
                        // Shuffle them to form pairs
                        
                        let activeMen = men.slice(0, Math.min(men.length, neededPairs + 2)).sort(() => Math.random() - 0.5).slice(0, neededPairs);
                        let activeWomen = women.slice(0, Math.min(women.length, neededPairs + 2)).sort(() => Math.random() - 0.5).slice(0, neededPairs);
                        
                        // Form pairs
                        let pairs = [];
                        let roundCost = 0;
                        
                        for(let k=0; k<activeMen.length; k++) {
                            const m = activeMen[k];
                            const w = activeWomen[k];
                            if (!m || !w) break;
                            
                            // Partner Penalty
                            if (hasPlayed(m, w)) roundCost += 1000;
                            pairs.push([m, w]);
                        }
                        
                        if (pairs.length >= 2) {
                            let currentMatches = [];
                            
                            // Pair up the pairs
                            for(let m=0; m < pairs.length - 1; m+=2) {
                                if (currentMatches.length >= settings.courts) break;
                                currentMatches.push({ team1: pairs[m], team2: pairs[m+1] });
                            }
                            
                            roundCost += calculateGlobalBalanceCost(currentMatches);
                            
                            if (roundCost < minCost) {
                                minCost = roundCost;
                                bestSetup = currentMatches;
                            }
                        }
                        if (minCost === 0) break;
                    }
                    
                    if(bestSetup) {
                        bestSetup.forEach((m, idx) => {
                             newMatches.push({ id: uid(), round, court: idx+1, finished: false, score1: 0, score2: 0, team1: m.team1, team2: m.team2 });
                        });
                    } else {
                         // Fallback logic
                         const count = Math.min(men.length, women.length);
                         const pairs = [];
                         for(let i=0; i<count; i++) pairs.push([men[i], women[i]]);
                         for (let i = 0; i < settings.courts; i++) {
                            if (pairs.length < 2) break;
                            newMatches.push({ id: uid(), round, court: i+1, finished: false, score1: 0, score2: 0, team1: pairs.shift(), team2: pairs.shift() });
                         }
                    }

                } else {
                     // Mix Mexicano / Random (MP weighted)
                     const count = Math.min(men.length, women.length);
                     const pairs = [];
                     // Simple MP sort pair up
                     for(let i=0; i<count; i++) pairs.push([men[i], women[i]]);
                     
                     // Mexicano sorts by score?
                     if (settings.format === 'mix_mexicano') {
                         pairs.sort((a,b) => (statsMap.get(b[0].id).setWon - statsMap.get(a[0].id).setWon));
                     } else {
                         pairs.sort(() => Math.random() - 0.5);
                     }

                     for (let i = 0; i < settings.courts; i++) {
                        if (pairs.length < 2) break;
                        newMatches.push({ id: uid(), round, court: i+1, finished: false, score1: 0, score2: 0, team1: pairs.shift(), team2: pairs.shift() });
                     }
                }

            } else {
                // --- AMERICANO (UNIVERSAL BALANCER - V42/V43) ---
                let pool = [...players];
                
                // Sort by MP to prioritize resters
                pool.sort((a,b) => {
                    const mpA = statsMap.get(a.id)?.mp || 0;
                    const mpB = statsMap.get(b.id)?.mp || 0;
                    return mpA - mpB;
                });

                if (settings.format === 'americano') {
                    let bestSetup = null;
                    let minCost = Infinity;
                    const iterations = 3000; 

                    for (let i = 0; i < iterations; i++) {
                        let needed = settings.courts * 4;
                        let activePool = pool.slice(0, Math.min(pool.length, needed + 2)); 
                        activePool.sort(() => Math.random() - 0.5);
                        activePool = activePool.slice(0, needed); 

                        let pairs = [];
                        let validPartners = true;

                        for (let j = 0; j < activePool.length - 1; j += 2) {
                            const p1 = activePool[j];
                            const p2 = activePool[j+1];
                            if (hasPlayed(p1, p2)) {
                                if (pool.length <= 8 && round <= 7) { validPartners = false; } 
                            }
                            pairs.push([p1, p2]);
                        }

                        if (!validPartners && pool.length === 8 && round <= 7) continue; 
                        
                        if (pairs.length >= 2) { 
                            let currentMatches = [];
                            let roundCost = 0;
                            
                            for (let m = 0; m < pairs.length - 1; m += 2) {
                                const t1 = pairs[m];
                                const t2 = pairs[m+1];
                                
                                if (hasPlayed(t1[0], t1[1])) roundCost += 1000;
                                if (hasPlayed(t2[0], t2[1])) roundCost += 1000;

                                currentMatches.push({ team1: t1, team2: t2 });
                            }

                            roundCost += calculateGlobalBalanceCost(currentMatches);

                            if (roundCost < minCost) {
                                minCost = roundCost;
                                bestSetup = currentMatches;
                            }
                        }
                    }

                    if (bestSetup) {
                        bestSetup.forEach((m, idx) => {
                            const sortPair = (p) => p.sort((a,b) => a.name.localeCompare(b.name));
                            newMatches.push({ id: uid(), round, court: idx+1, finished: false, score1: 0, score2: 0, team1: sortPair(m.team1), team2: sortPair(m.team2) });
                        });
                    } else {
                        alert("Nepavyko optimizuoti.");
                    }

                } else if (settings.format === 'mexicano' || settings.format === 'super_mexicano') {
                    pool.sort((a,b) => {
                        const sa = statsMap.get(a.id) || {setWon:0, diff:0, mp:0};
                        const sb = statsMap.get(b.id) || {setWon:0, diff:0, mp:0};
                        if (sa.mp !== sb.mp) return sa.mp - sb.mp;
                        return sb.setWon - sa.setWon || sb.diff - sa.diff;
                    });

                    for (let i = 0; i < settings.courts; i++) {
                        if (pool.length < 4) break;
                        const group = pool.splice(0, 4);
                        group.sort((a,b) => (statsMap.get(b.id).setWon - statsMap.get(a.id).setWon));
                        
                        if (settings.format === 'super_mexicano') {
                            newMatches.push({ id: uid(), round, court: i+1, finished: false, score1: 0, score2: 0, team1: [group[0], group[1]], team2: [group[2], group[3]] });
                        } else {
                            const best = { t1: [group[0], group[3]], t2: [group[1], group[2]] }; 
                            newMatches.push({ id: uid(), round, court: i+1, finished: false, score1: 0, score2: 0, team1: best.t1, team2: best.t2 });
                        }
                    }
                } 
            }

            if (newMatches.length > 0) {
                matches = [...matches, ...newMatches];
                saveData();
                switchView('matches');
            } else { alert("Nepavyko sudaryti porų."); }
        }

        function updateScore(id, team, val) {
            const m = matches.find(x => x.id === id);
            if (!m || m.finished) return;
            const cap = settings.winCondition === 'score' ? settings.maxPoints : 999999;
            if (team === 1) m.score1 = Math.min(cap, Math.max(0, m.score1 + val));
            else m.score2 = Math.min(cap, Math.max(0, m.score2 + val));
            saveData();
        }

        function finishMatch(id) {
            const m = matches.find(x => x.id === id);
            if (!m) return;
            m.finished = true; 
            saveData();
        }

        function undoMatch(id) {
            const m = matches.find(x => x.id === id);
            if (m) { m.finished = false; saveData(); }
        }

                        </div>` : ''}
                        <div class="flex flex-col overflow-hidden">
                            <span class="font-bold text-slate-800 text-sm leading-tight truncate">${p.name}</span>
                        </div>
                    </div>

                    <div class="w-7 font-bold text-xs ${mode === 'wins' ? 'text-green-700 bg-green-100 rounded' : 'text-green-600'}">${p.w}</div>
                    <div class="w-7 font-bold text-orange-400 text-xs">${p.d}</div>
                    <div class="w-7 font-bold text-red-400 text-xs">${p.l}</div>
                    
                    <div class="w-10 font-bold text-xs ${p.diff > 0 ? 'text-green-600' : (p.diff < 0 ? 'text-red-500' : 'text-slate-400')}">
                        ${p.diff > 0 ? '+' : ''}${p.diff}
                    </div>

                    <div class="w-10 text-right font-black text-lg ${mode === 'points' ? 'text-slate-900' : 'text-slate-500'}">
                        ${mode === 'wins' ? p.leaguePts : p.setWon}
                    </div>
                </div>
            `).join('');
        }

        render();
    </script>
</body>
</html>
