    <script>
        // --- DATA & STATE ---
        const ds = { matchDuration: 12, maxPoints: 21, courts: 2, winCondition: 'time', format: 'americano', rankingMode: 'points' };
        let players = [], matches = [], savedTournaments = [], settings = {...ds}, currentTid = null, curPh = null;
        let tempGender = 'M', timeLeft = 0, timerInterval, alarmInterval, isRunning = false, endTime = 0, dbRef = null, isCloud = false;

        function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

        // --- INIT ---
        try {
            players = JSON.parse(localStorage.getItem('p_v65')) || [];
            matches = JSON.parse(localStorage.getItem('m_v65')) || [];
            settings = {...ds, ...(JSON.parse(localStorage.getItem('s_v65')) || {})};
            savedTournaments = JSON.parse(localStorage.getItem('h_v65')) || [];
            currentTid = localStorage.getItem('tid_v65');
            timeLeft = settings.matchDuration * 60;
            const r = localStorage.getItem('r_v65');
            if(r) { document.getElementById('fb-room').value = r; initFirebaseConnection(true); }
        } catch(e) { localStorage.clear(); }

        // --- THE BRAINS (BALANCED GENERATOR) ---
        function getPartnerHistory() {
            const h = new Map();
            const all = [...savedTournaments.map(t=>t.matches).flat(), ...matches];
            all.forEach(m => {
                const add = (p1, p2) => {
                    if(!h.has(p1.id)) h.set(p1.id, new Map());
                    const m1 = h.get(p1.id); m1.set(p2.id, (m1.get(p2.id) || 0) + 1);
                };
                if(m.team1.length > 1) { add(m.team1[0], m.team1[1]); add(m.team1[1], m.team1[0]); }
                if(m.team2.length > 1) { add(m.team2[0], m.team2[1]); add(m.team2[1], m.team2[0]); }
            });
            return h;
        }

        function calculateBalanceCost(prop) {
            const stats = new Map();
            players.forEach(p => stats.set(p.id, new Map()));
            prop.forEach(m => {
                m.team1.forEach(p1 => m.team2.forEach(p2 => {
                    const m1 = stats.get(p1.id); if(m1) m1.set(p2.id, (m1.get(p2.id)||0)+1);
                    const m2 = stats.get(p2.id); if(m2) m2.set(p1.id, (m2.get(p1.id)||0)+1);
                }));
            });
            let cost = 0;
            for(const [_, m] of stats) for(const [_, c] of m) cost += (c * c);
            return cost;
        }

        function generateRound() {
            if(players.length < 4) return alert("Min 4 žaidėjai!");
            let newM = [], roundNum = (matches[matches.length-1]?.round || 0) + 1;
            const hist = getPartnerHistory();
            let bestSet = null, minScore = Infinity;

            for(let i=0; i<5000; i++) {
                let pool = [...players].sort(() => Math.random() - 0.5);
                let currentSet = [], currentScore = 0;
                
                if(settings.format.includes('mix')) {
                    let m = pool.filter(p=>p.gender==='M'), f = pool.filter(p=>p.gender==='F');
                    let courtsNeeded = Math.min(settings.courts, Math.floor(m.length/2), Math.floor(f.length/2));
                    if(courtsNeeded === 0) break;
                    for(let c=0; c<courtsNeeded; c++) {
                        const t1 = [m.pop(), f.pop()], t2 = [m.pop(), f.pop()];
                        currentScore += (hist.get(t1[0].id)?.get(t1[1].id) || 0) * 50;
                        currentScore += (hist.get(t2[0].id)?.get(t2[1].id) || 0) * 50;
                        currentSet.push({ team1: t1, team2: t2 });
                    }
                } else if(settings.format === 'fixed') {
                    let teams = []; for(let k=0; k<players.length; k+=2) if(k+1 < players.length) teams.push([players[k], players[k+1]]);
                    teams.sort(() => Math.random() - 0.5);
                    for(let c=0; c < Math.min(settings.courts, Math.floor(teams.length/2)); c++) {
                        currentSet.push({ team1: teams.pop(), team2: teams.pop() });
                    }
                } else {
                    for(let c=0; c < Math.min(settings.courts, Math.floor(pool.length/4)); c++) {
                        const t1 = [pool.pop(), pool.pop()], t2 = [pool.pop(), pool.pop()];
                        currentScore += (hist.get(t1[0].id)?.get(t1[1].id) || 0) * 50;
                        currentScore += (hist.get(t2[0].id)?.get(t2[1].id) || 0) * 50;
                        currentSet.push({ team1: t1, team2: t2 });
                    }
                }
                if(currentSet.length === 0) continue;
                currentScore += calculateBalanceCost(currentSet);
                if(currentScore < minScore) { minScore = currentScore; bestSet = currentSet; if(minScore === 0) break; }
            }

            // Failsafe if Monte Carlo failed
            if(!bestSet && players.length >= 4) {
                let pool = [...players].sort(() => Math.random() - 0.5);
                bestSet = [{ team1: [pool.pop(), pool.pop()], team2: [pool.pop(), pool.pop()] }];
            }

            if(bestSet) {
                bestSet.forEach((m, idx) => { newM.push({ id: uid(), round: roundNum, court: idx+1, finished: false, score1:0, score2:0, team1: m.team1, team2: m.team2 }); });
                matches = [...matches, ...newM]; autoSave(); switchView('matches');
            } else alert("Nepavyko suformuoti mačo.");
        }

        // --- DATA SYNC ---
        function autoSave() {
            if(players.length === 0 && matches.length === 0) return;
            if(!currentTid) {
                currentTid = uid(); localStorage.setItem('tid_v65', currentTid);
                savedTournaments.unshift({ id: currentTid, name: new Date().toLocaleDateString('lt-LT') + ' Turnyras', date: new Date().toISOString(), players: [], matches: [], settings: {} });
            }
            const idx = savedTournaments.findIndex(x => x.id === currentTid);
            if(idx > -1) {
                savedTournaments[idx].players = JSON.parse(JSON.stringify(players));
                savedTournaments[idx].matches = JSON.parse(JSON.stringify(matches));
                savedTournaments[idx].settings = JSON.parse(JSON.stringify(settings));
                savedTournaments[idx].lastUpdate = Date.now();
            }
            localStorage.setItem('p_v65', JSON.stringify(players));
            localStorage.setItem('m_v65', JSON.stringify(matches));
            localStorage.setItem('s_v65', JSON.stringify(settings));
            localStorage.setItem('h_v65', JSON.stringify(savedTournaments));
            if(isCloud && dbRef) dbRef.set({ players, matches, settings, lastUpdate: Date.now() });
            render();
        }

        function calculateStats(mArr, pArr, isF = false) {
            let res = [];
            if(isF) { for(let i=0; i<pArr.length; i+=2) if(i+1 < pArr.length) res.push({ id: pArr[i].id+'_'+pArr[i+1].id, name: pArr[i].name+' / '+pArr[i+1].name, p1: pArr[i], p2: pArr[i+1], mp:0, w:0, t:0, l:0, sw:0, sl:0, dif:0, lp:0 }); }
            else { res = pArr.map(p => ({ ...p, mp:0, w:0, t:0, l:0, sw:0, sl:0, dif:0, lp:0 })); }
            mArr.filter(m => m.finished).forEach(m => {
                const up = (team, myS, enS) => {
                    let targets = isF ? [res.find(r => r.p1.id === team[0].id || r.p2.id === team[0].id)] : team.map(p => res.find(r => r.id === p.id));
                    targets.forEach(s => { if(!s) return; s.mp++; s.sw += myS; s.sl += enS; s.dif = s.sw - s.sl; if(myS > enS) { s.w++; s.lp += 2; } else if(myS < enS) s.l++; else { s.t++; s.lp += 1; } });
                };
                up(m.team1, m.score1, m.score2); up(m.team2, m.score2, m.score1);
            });
            return res.sort((a,b) => settings.rankingMode === 'wins' ? (b.lp - a.lp || b.dif - a.dif) : (b.sw - a.sw || b.dif - a.dif));
        }

        function render() {
            const isF = settings.format === 'fixed';
            const table = calculateStats(matches, players, isF);
            document.getElementById('leaderboard-body').innerHTML = table.map((s, i) => `
                <div class="flex items-center px-3 py-3 text-xs bg-white border-b border-slate-50">
                    <div class="w-6 font-bold text-slate-400 text-[10px]">${i+1}</div>
                    <div class="flex-1 flex items-center gap-2 truncate font-bold text-slate-800">
                        ${!isF && s.photo ? `<div class="relative w-7 h-7 shrink-0"><img src="${s.photo}" class="w-full h-full rounded-full object-cover ${s.gender==='M'?'avatar-frame-m':'avatar-frame-f'}"><div class="absolute -bottom-1 -right-1 w-3 h-3 rounded-full flex items-center justify-center text-[7px] text-white font-black ${s.gender==='M'?'bg-blue-600':'bg-pink-600'}">${s.gender==='M'?'V':'M'}</div></div>` : ''}
                        ${s.name}
                    </div>
                    <div class="stat-col text-green-600">${s.w}</div><div class="stat-col text-slate-300">${s.t}</div><div class="stat-col text-red-400">${s.l}</div>
                    <div class="stat-col ${s.dif>=0?'text-slate-600':'text-red-500'}">${s.dif>0?'+':''}${s.dif}</div>
                    <div class="stat-col-wide text-slate-900">${settings.rankingMode==='wins'?s.lp:s.sw}</div>
                </div>`).join('');

            const curT = savedTournaments.find(x => x.id === currentTid);
            document.getElementById('btn-rename-tournament').innerText = curT ? `✏️ ${curT.name.toUpperCase()}` : `✏️ PERVADINTI TURNYRĄ`;
            document.getElementById('players-list').innerHTML = players.slice().reverse().map(p => `
                <div class="flex justify-between items-center bg-white p-2 rounded-xl border border-slate-100 shadow-sm">
                    <div class="flex items-center gap-2">
                        ${p.photo ? `<div class="relative w-9 h-9"><img src="${p.photo}" class="w-full h-full rounded-full object-cover ${p.gender==='M'?'avatar-frame-m':'avatar-frame-f'}"><div class="absolute -bottom-1 -right-1 w-4 h-4 rounded-full flex items-center justify-center text-[8px] text-white font-black ${p.gender==='M'?'bg-blue-600':'bg-pink-600'}">${p.gender==='M'?'V':'M'}</div></div>` : `<div class="w-9 h-9 rounded-full flex items-center justify-center text-[9px] font-bold text-white ${p.gender==='M'?'bg-blue-500':'bg-pink-500'}">${p.gender==='M'?'V':'M'}</div>`}
                        <div class="font-bold text-slate-800 text-sm">${p.name}</div>
                    </div>
                    <button onclick="removePlayer('${p.id}')" class="text-slate-300 text-lg px-2">×</button>
                </div>`).join('');

            const isSc = settings.winCondition === 'score';
            document.getElementById('mode-time').className = !isSc ? "flex-1 py-1.5 text-[10px] font-black rounded-md bg-white shadow text-slate-900" : "flex-1 py-1.5 text-[10px] font-bold text-slate-400";
            document.getElementById('mode-score').className = isSc ? "flex-1 py-1.5 text-[10px] font-black rounded-md bg-white shadow text-slate-900" : "flex-1 py-1.5 text-[10px] font-bold text-slate-400";
            document.getElementById('control-duration').style.display = !isSc ? 'block' : 'none';
            document.getElementById('control-points').style.display = isSc ? 'block' : 'none';
            document.getElementById('score-mode-text').style.display = isSc ? 'block' : 'none';
            document.getElementById('timer-controls').style.display = isSc ? 'none' : 'flex';
            if(isSc) document.getElementById('score-mode-text').innerText = `IKI ${settings.maxPoints} TAŠKŲ`;
            document.getElementById('val-duration').innerText = settings.matchDuration;
            document.getElementById('val-points').innerText = settings.maxPoints;
            document.getElementById('val-courts').innerText = settings.courts;
            document.getElementById('player-count').innerText = "Viso: " + players.length;
            document.getElementById('select-format').value = settings.format;
            document.getElementById('select-ranking').value = settings.rankingMode;
            updateTimerUI(); renderMatches();
        }

        function renderGlobalStats() {
            const tF = document.getElementById('stat-tournament').value;
            const gF = document.getElementById('stat-gender').value;
            const pF = document.getElementById('stat-player').value;
            let cM = [], cP = [];
            if(tF === 'ALL') { savedTournaments.forEach(t => { cM.push(...t.matches); cP.push(...t.players); }); cM.push(...matches); cP.push(...players); }
            else if(tF === 'CURRENT') { cM = matches; cP = players; }
            else { const t = savedTournaments.find(x=>x.id===tF); if(t){ cM=t.matches; cP=t.players; } }
            const uP = []; const seen = new Set();
            cP.forEach(p => { if(!seen.has(p.name)){ seen.add(p.name); uP.push(p); } });
            const list = calculateStats(cM, uP, false);
            let filtered = list;
            if(gF !== 'ALL') filtered = filtered.filter(x => x.gender === gF);
            if(pF !== 'ALL') filtered = filtered.filter(x => x.name === pF);
            const pSel = document.getElementById('stat-player'); const curP = pSel.value;
            pSel.innerHTML = '<option value="ALL">Visi žaidėjai</option>' + Array.from(seen).sort().map(n => `<option value="${n}" ${n===curP?'selected':''}>${n}</option>`).join('');
            document.getElementById('global-stats-body').innerHTML = filtered.map((s, i) => `
                <div class="flex items-center px-3 py-3 text-[11px] bg-white border-b border-slate-50">
                    <div class="w-6 text-slate-400 font-bold">${i+1}</div>
                    <div class="flex-1 flex items-center gap-2 truncate font-bold text-slate-800">
                        ${s.photo ? `<div class="relative w-6 h-6"><img src="${s.photo}" class="w-full h-full rounded-full object-cover ${s.gender==='M'?'avatar-frame-m':'avatar-frame-f'}"><div class="absolute -bottom-1 -right-1 w-2.5 h-2.5 rounded-full flex items-center justify-center text-[6px] text-white font-black ${s.gender==='M'?'bg-blue-600':'bg-pink-600'}">${s.gender==='M'?'V':'M'}</div></div>` : ''}
                        ${s.name}
                    </div>
                    <div class="stat-col text-slate-500">${s.mp}</div><div class="stat-col text-green-600">${s.w}</div><div class="stat-col text-slate-300">${s.t}</div><div class="stat-col text-red-400">${s.l}</div>
                    <div class="stat-col-wide text-slate-900">${s.mp>0?Math.round((s.w/s.mp)*100):0}%</div>
                </div>`).join('');
        }

        // --- ACTIONS ---
        function addPlayer(e) { e.preventDefault(); const f = document.getElementById('player-input-field'); const n = f.value.trim(); if(!n) return; players.push({ id: uid(), name: n, gender: tempGender, photo: curPh }); f.value = ''; curPh = null; document.getElementById('photo-preview').classList.add('hidden'); document.getElementById('photo-placeholder').classList.remove('hidden'); autoSave(); }
        function handlePhotoUpload(e) { const file = e.target.files[0]; if(!file) return; const reader = new FileReader(); reader.onload = function(ev) { const img = new Image(); img.onload = function() { const c = document.createElement('canvas'); const MAX = 120; let w = img.width, h = img.height; if(w>h) { if(w>MAX){ h*=MAX/w; w=MAX; } } else { if(h>MAX){ w*=MAX/h; h=MAX; } } c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); curPh = c.toDataURL('image/jpeg', 0.6); document.getElementById('photo-preview').src = curPh; document.getElementById('photo-preview').classList.remove('hidden'); document.getElementById('photo-placeholder').classList.add('hidden'); }; img.src = ev.target.result; }; reader.readAsDataURL(file); }
        function setGender(g) { tempGender = g; document.getElementById('gender-m').className = g==='M'?'w-8 font-bold bg-blue-600 text-white text-xs':'w-8 font-bold text-slate-400 text-xs'; document.getElementById('gender-f').className = g==='F'?'w-8 font-bold bg-pink-500 text-white text-xs':'w-8 font-bold text-slate-400 text-xs'; }
        function setMode(m) { settings.winCondition = m; resetTimer(); autoSave(); }
        function changeSetting(k, v) { settings[k] = Math.max(1, (settings[k]||0)+v); if(k==='matchDuration') resetTimer(); autoSave(); }
        function changeFormat(v) { settings.format = v; autoSave(); }
        function changeRanking(v) { settings.rankingMode = v; autoSave(); }
        function removePlayer(id) { if(confirm("Trinti žaidėją?")) { players = players.filter(p => p.id !== id); autoSave(); } }
        function updSc(id, t, v) { const m = matches.find(x=>x.id===id); if(m){ if(t===1) m.score1=Math.max(0, m.score1+v); else m.score2=Math.max(0, m.score2+v); autoSave(); } }
        function finM(id) { const m = matches.find(x=>x.id===id); if(m){ m.finished=true; autoSave(); } }
        function undoM(id) { const m = matches.find(x=>x.id===id); if(m){ m.finished=false; autoSave(); } }
        function renameCurrentTournament() { const idx = savedTournaments.findIndex(x=>x.id===currentTid); if(idx>-1){ const n=prompt("Pavadinimas:", savedTournaments[idx].name); if(n){ savedTournaments[idx].name=n; autoSave(); }} }
        function resetScores() { if(confirm("Naujas turnyras? Mačai bus ištrinti.")) { currentTid = null; matches = []; autoSave(); switchView('setup'); } }
        function resetAll() { if(confirm("VISKĄ TRINTI?")) { players = []; matches = []; currentTid = null; localStorage.clear(); location.reload(); } }

        function toggleTimer() {
            if(settings.winCondition==='score') return;
            if(alarmInterval) { clearInterval(alarmInterval); alarmInterval=null; resetTimer(); return; }
            if(isRunning) { clearInterval(timerInterval); isRunning=false; }
            else { if(timeLeft <= 0) return; isRunning = true; endTime = Date.now() + (timeLeft * 1000); timerInterval = setInterval(() => { const d = Math.ceil((endTime - Date.now())/1000); if(d > 0) { timeLeft = d; updateTimerUI(); } else { timeLeft = 0; clearInterval(timerInterval); isRunning = false; triggerAlarm(); } }, 1000); }
            updateTimerUI();
        }
        function updateTimerUI() {
            const m = Math.floor(timeLeft/60).toString().padStart(2,'0'), s = (timeLeft%60).toString().padStart(2,'0');
            document.getElementById('timer-display').innerText = `${m}:${s}`;
            const b = document.getElementById('btn-play'), i1=document.getElementById('icon-play'), i2=document.getElementById('icon-pause'), i3=document.getElementById('icon-stop');
            i1.classList.add('hidden'); i2.classList.add('hidden'); i3.classList.add('hidden');
            if(alarmInterval) { b.className="w-10 h-10 rounded-full flex items-center justify-center bg-red-600 alarm-active"; i3.classList.remove('hidden'); }
            else if(isRunning) { b.className="w-10 h-10 rounded-full flex items-center justify-center bg-orange-100 text-orange-600"; i2.classList.remove('hidden'); }
            else { b.className="w-10 h-10 rounded-full flex items-center justify-center bg-green-600 text-white"; i1.classList.remove('hidden'); }
        }
        function triggerAlarm() { if(alarmInterval) return; playBuzzer(); alarmInterval = setInterval(playBuzzer, 3000); render(); }
        function playBuzzer() { try { const ctx = new (window.AudioContext || window.webkitAudioContext)(); const now = ctx.currentTime; const o1 = ctx.createOscillator(); const g = ctx.createGain(); o1.type = 'sawtooth'; o1.frequency.setValueAtTime(130, now); o1.connect(g); g.connect(ctx.destination); g.gain.setValueAtTime(0, now); g.gain.linearRampToValueAtTime(0.6, now+0.05); g.gain.setValueAtTime(0.6, now+1.8); g.gain.linearRampToValueAtTime(0, now+2); o1.start(); o1.stop(now+2); if(navigator.vibrate) navigator.vibrate(1000); } catch(e){} }
        function resetTimer() { timeLeft = settings.matchDuration * 60; isRunning = false; clearInterval(timerInterval); render(); }
        function adjustTime(s) { if(!isRunning) { timeLeft = Math.max(0, timeLeft + s); render(); } }

        function switchView(n) {
            document.querySelectorAll('.view-section').forEach(e => e.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(e => e.classList.remove('active'));
            document.getElementById('view-' + n).classList.add('active');
            document.getElementById('nav-' + n).classList.add('active');
            if(n==='stats') { const s = document.getElementById('stat-tournament'); s.innerHTML = '<option value="ALL">Visi turnyrai</option><option value="CURRENT">Dabartinis</option>' + savedTournaments.map(t => `<option value="${t.id}">${t.name}</option>`).join(''); renderGlobalStats(); }
            if(n==='history') renderHistoryList();
            if(n==='leader') render();
        }
        function renderHistoryList() { document.getElementById('history-list').innerHTML = savedTournaments.map(t => `<div class="bg-white p-4 rounded-xl border ${t.id===currentTid?'border-green-400 shadow-md':'border-slate-200'}"><div class="flex justify-between mb-1"><div class="font-bold text-slate-800 text-sm">${t.name}</div><div class="text-[9px] bg-slate-100 px-2 py-1 rounded font-black uppercase text-slate-500">${t.settings?.format || '---'}</div></div><div class="text-[10px] text-slate-400 mb-3">${new Date(t.date).toLocaleString('lt-LT')}</div><div class="flex gap-2"><button onclick="loadHistory('${t.id}')" class="flex-1 py-2 bg-blue-50 text-blue-600 rounded-lg font-bold text-xs uppercase">${t.id===currentTid?'Tęsti':'Užkrauti'}</button><button onclick="deleteHistory('${t.id}')" class="px-4 py-2 bg-red-50 text-red-500 rounded-lg font-bold">×</button></div></div>`).join(''); }
        function loadHistory(id) { const t = savedTournaments.find(x => x.id === id); if(t && confirm("Užkrauti?")) { players = JSON.parse(JSON.stringify(t.players)); matches = JSON.parse(JSON.stringify(t.matches)); settings = {...ds, ...t.settings}; currentTid = id; localStorage.setItem('tid_v65', id); resetTimer(); autoSave(); switchView('matches'); } }
        function deleteHistory(id) { if(confirm("Trinti?")) { savedTournaments = savedTournaments.filter(x => x.id !== id); if(currentTid===id) { currentTid=null; localStorage.removeItem('tid_v65'); } autoSave(); renderHistoryList(); } }
        function renderMatches() {
            const active = matches.filter(m => !m.finished);
            document.getElementById('matches-container').innerHTML = active.map(m => `
                <div class="bg-white rounded-2xl shadow-md border border-slate-100 overflow-hidden mb-4">
                    <div class="bg-slate-800 text-white px-4 py-1.5 text-[9px] font-black tracking-widest flex justify-between uppercase"><span>AIKŠTELĖ ${m.court}</span><span>RAUNDAS ${m.round}</span></div>
                    <div class="p-4"><div class="flex justify-between items-center mb-3"><div class="flex flex-col gap-1">${m.team1.map(p => `<span class="font-bold text-sm text-slate-700">${p.name}</span>`).join('')}</div><div class="flex items-center gap-2"><button onclick="updSc('${m.id}',1,-1)" class="w-8 h-8 bg-slate-50 border rounded font-bold">-</button><span class="text-2xl font-black w-8 text-center">${m.score1}</span><button onclick="updSc('${m.id}',1,1)" class="w-8 h-8 bg-green-500 text-white rounded font-bold">+</button></div></div>
                    <div class="flex justify-between items-center mb-5"><div class="flex flex-col gap-1">${m.team2.map(p => `<span class="font-bold text-sm text-slate-700">${p.name}</span>`).join('')}</div><div class="flex items-center gap-2"><button onclick="updSc('${m.id}',2,-1)" class="w-8 h-8 bg-slate-50 border rounded font-bold">-</button><span class="text-2xl font-black w-8 text-center">${m.score2}</span><button onclick="updSc('${m.id}',2,1)" class="w-8 h-8 bg-green-500 text-white rounded font-bold">+</button></div></div>
                    <button onclick="finM('${m.id}')" class="w-full py-3 bg-slate-900 text-white rounded-xl font-bold text-xs uppercase tracking-widest">Užbaigti Mačą</button></div>
                </div>`).join('');
            const fin = matches.filter(m => m.finished).reverse();
            document.getElementById('finished-matches-container').innerHTML = fin.length ? '<h3 class="text-[9px] font-black text-slate-400 uppercase mb-3 tracking-widest">Paskutiniai mačai</h3>' + fin.map(m => `<div class="bg-white p-3 rounded-xl border mb-2 flex justify-between items-center text-[11px]"><div class="truncate font-bold text-slate-600">${m.team1.map(p=>p.name).join('/')} vs ${m.team2.map(p=>p.name).join('/')}</div><div class="flex items-center gap-3"><div class="font-black bg-slate-100 px-2 py-1 rounded text-slate-800">${m.score1}:${m.score2}</div><button onclick="undoM('${m.id}')" class="text-red-400 font-bold uppercase text-[9px]">Taisyti</button></div></div>`).join('') : '';
        }

        function initFirebaseConnection(silent = false) {
            const room = document.getElementById('fb-room').value.trim(); if(!room) return;
            const config = { apiKey: document.getElementById('fb-apiKey').value, authDomain: document.getElementById('fb-authDomain').value, databaseURL: document.getElementById('fb-databaseURL').value, projectId: document.getElementById('fb-projectId').value };
            try {
                if(!firebase.apps.length) firebase.initializeApp(config);
                dbRef = firebase.database().ref('pad_v65/' + room); isCloud = true; localStorage.setItem('r_v65', room);
                document.getElementById('cloud-status').innerText = "Prijungta"; document.getElementById('cloud-status').className = "text-[10px] bg-green-500 px-2 py-1 rounded font-bold text-white shadow-lg";
                document.getElementById('cloud-connect-ui').classList.add('hidden'); document.getElementById('cloud-active-ui').classList.remove('hidden');
                document.getElementById('cloud-room-name-display').innerText = room;
                dbRef.on('value', snap => {
                    const d = snap.val(); if(d && (JSON.stringify(d.players) !== JSON.stringify(players) || JSON.stringify(d.matches) !== JSON.stringify(matches))) {
                        players = d.players || []; matches = d.matches || []; settings = {...ds, ...d.settings}; render();
                        document.getElementById('sync-bar').style.width = "100%"; setTimeout(() => document.getElementById('sync-bar').style.width = "0", 400);
                    }
                });
            } catch(e) { console.error(e); }
        }
        function disconnectFirebase() { if(dbRef) dbRef.off(); isCloud = false; dbRef = null; localStorage.removeItem('r_v65'); document.getElementById('cloud-connect-ui').classList.remove('hidden'); document.getElementById('cloud-active-ui').classList.add('hidden'); document.getElementById('cloud-status').innerText = "Atsijungta"; }

        render();
    </script>
</body>
</html>
