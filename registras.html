<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperPadel.lt | Administratorius v1.1.0</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; margin: 0; }
        .admin-btn { padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; border: none; font-size: 12px; margin: 2px; }
        .btn-edit { background: #009fe3; color: white; }
        .btn-delete { background: #e53e3e; color: white; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 12px; border-bottom: 1px solid #e2e8f0; text-align: left; }
    </style>
</head>
<body>

    <div id="admin-view-zaidejai" style="padding: 20px;">
        <h1>Žaidėjų bazė (v1.1.0)</h1>
        <div id="admin-players-list-db">Kraunama...</div>
    </div>

    <div id="adminEditPlayerModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999;">
        <div style="background:white; padding:20px; margin:50px auto; width:90%; max-width:400px; border-radius:10px;">
            <h3>Redaguoti žaidėją</h3>
            <input type="hidden" id="editAdminPlayerId">
            <input type="text" id="editAdminPlayerName" placeholder="Vardas" style="width:100%; margin-bottom:10px;">
            <input type="number" id="editAdminPlayerRating" placeholder="ELO" style="width:100%; margin-bottom:10px;">
            <button onclick="window.saveAdminPlayerChanges()">Išsaugoti</button>
            <button onclick="document.getElementById('adminEditPlayerModal').style.display='none'">Uždaryti</button>
        </div>
    </div>

    <script>
        // GLOBALIAI KINTAMIEJI
        window.adminGlobalPlayers = [];

        window.loadAdminPlayersDB = function() {
            const container = document.getElementById('admin-players-list-db');
            firebase.database().ref("padelio_global_players").once('value').then(snap => {
                let data = snap.val() || {};
                window.adminGlobalPlayers = Object.keys(data).map(key => ({id: key, ...data[key]}));
                window.renderAdminPlayersDB(window.adminGlobalPlayers);
            });
        };

        window.renderAdminPlayersDB = function(players) {
            const container = document.getElementById('admin-players-list-db');
            let html = '<table>';
            players.forEach(p => {
                html += `<tr>
                    <td>${p.name || 'Nenurodytas'}</td>
                    <td>
                        <button class="admin-btn btn-edit" onclick="window.openAdminEditModal('${p.id}')">Keisti</button>
                        <button class="admin-btn btn-delete" onclick="window.deleteAdminPlayerLive('${p.id}')">Trinti</button>
                    </td>
                </tr>`;
            });
            html += '</table>';
            container.innerHTML = html;
        };

        window.openAdminEditModal = function(id) {
            let p = window.adminGlobalPlayers.find(x => String(x.id) === String(id));
            if(!p) return;
            document.getElementById('editAdminPlayerId').value = p.id;
            document.getElementById('editAdminPlayerName').value = p.name || '';
            document.getElementById('editAdminPlayerRating').value = p.rating || 300;
            document.getElementById('adminEditPlayerModal').style.display = 'flex';
        };

        window.saveAdminPlayerChanges = function() {
            const id = document.getElementById('editAdminPlayerId').value;
            const name = document.getElementById('editAdminPlayerName').value;
            const rating = parseInt(document.getElementById('editAdminPlayerRating').value);
            firebase.database().ref("padelio_global_players/" + id).update({ name, rating }).then(() => {
                alert("Atnaujinta!");
                document.getElementById('adminEditPlayerModal').style.display = 'none';
                window.loadAdminPlayersDB();
            });
        };

        window.deleteAdminPlayerLive = function(id) {
            if(confirm("Ar tikrai trinti?")) {
                firebase.database().ref("padelio_global_players/" + id).remove().then(() => window.loadAdminPlayersDB());
            }
        };

        window.addEventListener('load', () => window.loadAdminPlayersDB());
    </script>
</body>
</html>
