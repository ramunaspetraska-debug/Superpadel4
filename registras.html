<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <title>SuperPadel.lt | Administratorius v1.1.3</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; padding: 20px; }
        .admin-btn { padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; border: none; font-size: 12px; margin: 2px; }
        .btn-edit { background: #009fe3; color: white; }
        .btn-delete { background: #e53e3e; color: white; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 12px; border-bottom: 1px solid #e2e8f0; text-align: left; }
    </style>
</head>
<body>

    <div id="admin-view-zaidejai">
        <h1>Žaidėjų bazė v1.1.3</h1>
        <div id="admin-players-list-db">Kraunama...</div>
    </div>

    <div id="adminEditPlayerModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; justify-content:center; align-items:center;">
        <div style="background:white; padding:20px; width:90%; max-width:400px; border-radius:10px;">
            <h3>Redaguoti žaidėją</h3>
            <input type="hidden" id="editAdminPlayerId">
            <input type="text" id="editAdminPlayerName" style="width:100%; margin-bottom:10px; padding:8px;">
            <input type="number" id="editAdminPlayerRating" style="width:100%; margin-bottom:10px; padding:8px;">
            <button onclick="window.saveAdminPlayerChanges()">Išsaugoti</button>
            <button onclick="document.getElementById('adminEditPlayerModal').style.display='none'">Uždaryti</button>
        </div>
    </div>

    <script>
        // FUNKCIJOS KURIAS NARŠYKLĖ MATYS TIESIOGIAI
        window.openAdminEditModal = function(id) {
            let p = window.globalAdminPlayers.find(x => String(x.id) === String(id));
            if(!p) return;
            document.getElementById('editAdminPlayerId').value = p.id;
            document.getElementById('editAdminPlayerName').value = p.name || '';
            document.getElementById('editAdminPlayerRating').value = p.rating || 300;
            document.getElementById('adminEditPlayerModal').style.display = 'flex';
        };

        window.saveAdminPlayerChanges = function() {
            const id = document.getElementById('editAdminPlayerId').value;
            const name = document.getElementById('editAdminPlayerName').value;
            const rating = parseInt(document.getElementById('editAdminPlayerRating').value);
            firebase.database().ref("padelio_global_players/" + id).update({ name, rating }).then(() => {
                alert("Atnaujinta!");
                document.getElementById('adminEditPlayerModal').style.display = 'none';
                loadAdminPlayersDB(); // Atnaujina lentelę
            });
        };

        window.deleteAdminPlayer = function(id) {
            if(confirm("Tikrai trinti?")) {
                firebase.database().ref("padelio_global_players/" + String(id).trim()).remove().then(() => loadAdminPlayersDB());
            }
        };

        // Prisijungiame prie core failo kintamųjų (jei jie egzistuoja)
        window.addEventListener('load', () => {
            setTimeout(loadAdminPlayersDB, 1000);
        });
    </script>
</body>
</html>
