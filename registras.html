<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>SuperPadel.lt | Administratorius v1.1.1</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="/css/registras.css">
    <style>
        .admin-btn { padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; border: none; font-size: 12px; margin: 2px; }
        .btn-edit { background: #009fe3; color: white; }
        .btn-delete { background: #e53e3e; color: white; }
    </style>
</head>
<body>

    <div id="admin-view-zaidejai" style="padding: 20px;">
        <h1>Žaidėjų bazė (v1.1.1)</h1>
        <div id="admin-players-list-db">Kraunama...</div>
    </div>

    <div id="adminEditPlayerModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; justify-content:center; align-items:center;">
        <div style="background:white; padding:20px; width:90%; max-width:400px; border-radius:10px;">
            <h3>Redaguoti žaidėją</h3>
            <input type="hidden" id="editAdminPlayerId">
            <input type="text" id="editAdminPlayerName" placeholder="Vardas" style="width:100%; margin-bottom:10px;">
            <input type="number" id="editAdminPlayerRating" placeholder="ELO" style="width:100%; margin-bottom:10px;">
            <button id="saveChangesBtn">Išsaugoti</button>
            <button onclick="document.getElementById('adminEditPlayerModal').style.display='none'">Uždaryti</button>
        </div>
    </div>

    <script>
        let adminGlobalPlayers = [];
        const GLOBAL_PLAYERS_KEY = "padelio_global_players";

        // 🛡️ PERĖMIMAS: Vietoj HTML onclick naudojame „Event Listeners“
        document.addEventListener('DOMContentLoaded', () => {
            loadData();
            
            // Užtikriname, kad Išsaugojimo mygtukas veiktų nepriklausomai
            document.getElementById('saveChangesBtn').addEventListener('click', saveChanges);
        });

        function loadData() {
            firebase.database().ref(GLOBAL_PLAYERS_KEY).once('value').then(snap => {
                let data = snap.val() || {};
                adminGlobalPlayers = Object.keys(data).map(key => ({id: key, ...data[key]}));
                renderTable();
            });
        }

        function renderTable() {
            const container = document.getElementById('admin-players-list-db');
            let html = '<table>';
            adminGlobalPlayers.forEach(p => {
                html += `<tr>
                    <td>${p.name || 'Nenurodytas'}</td>
                    <td>
                        <button class="admin-btn btn-edit" data-id="${p.id}">Keisti</button>
                        <button class="admin-btn btn-delete" data-id="${p.id}">Trinti</button>
                    </td>
                </tr>`;
            });
            html += '</table>';
            container.innerHTML = html;

            // Prisegame paspaudimo įvykius po lentelės sugeneravimo
            document.querySelectorAll('.btn-edit').forEach(btn => {
                btn.addEventListener('click', (e) => openModal(e.target.dataset.id));
            });
            document.querySelectorAll('.btn-delete').forEach(btn => {
                btn.addEventListener('click', (e) => deletePlayer(e.target.dataset.id));
            });
        }

        function openModal(id) {
            let p = adminGlobalPlayers.find(x => String(x.id) === String(id));
            if(!p) return;
            document.getElementById('editAdminPlayerId').value = p.id;
            document.getElementById('editAdminPlayerName').value = p.name || '';
            document.getElementById('editAdminPlayerRating').value = p.rating || 300;
            document.getElementById('adminEditPlayerModal').style.display = 'flex';
        }

        function saveChanges() {
            const id = document.getElementById('editAdminPlayerId').value;
            const name = document.getElementById('editAdminPlayerName').value;
            const rating = parseInt(document.getElementById('editAdminPlayerRating').value);
            firebase.database().ref(GLOBAL_PLAYERS_KEY + '/' + id).update({ name, rating }).then(() => {
                alert("Išsaugota!");
                document.getElementById('adminEditPlayerModal').style.display = 'none';
                loadData();
            });
        }

        function deletePlayer(id) {
            if(confirm("Trinti?")) {
                firebase.database().ref(GLOBAL_PLAYERS_KEY + '/' + String(id).trim()).remove().then(() => loadData());
            }
        }
    </script>
</body>
</html>
