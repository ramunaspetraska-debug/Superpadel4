<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>SuperPadel.lt | Administratorius v1.0.9</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="/css/registras.css">
</head>
<body>

    <div id="admin-view-zaidejai" style="padding: 20px;">
        <h1>Žaidėjų bazė (v1.0.9)</h1>
        <input type="text" id="adminPlayerSearch" onkeyup="window.filterAdminPlayers()" placeholder="Paieška...">
        <div id="admin-players-list-db"></div>
    </div>

    <div id="adminEditPlayerModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999;">
        <div style="background:white; padding:20px; margin:50px auto; width:90%; max-width:400px; border-radius:10px;">
            <h3>Redaguoti žaidėją</h3>
            <input type="hidden" id="editAdminPlayerId">
            <input type="text" id="editAdminPlayerName" placeholder="Vardas">
            <input type="number" id="editAdminPlayerRating" placeholder="ELO">
            <button onclick="window.saveAdminPlayerChanges()">Išsaugoti</button>
            <button onclick="window.closeAdminEditModal()">Uždaryti</button>
        </div>
    </div>

    <script>
        // GLOBALIAI KINTAMIEJI
        window.adminGlobalPlayers = [];
        const GLOBAL_PLAYERS_KEY = "padelio_global_players";

        // 1. Žaidėjų krovimas
        window.loadAdminPlayersDB = function() {
            firebase.database().ref(GLOBAL_PLAYERS_KEY).once('value').then(snap => {
                let data = snap.val() || {};
                window.adminGlobalPlayers = Object.keys(data).map(key => ({id: key, ...data[key]}));
                window.renderAdminPlayersDB(window.adminGlobalPlayers);
            });
        };

        // 2. Lentelės atvaizdavimas (su saugiais mygtukais)
        window.renderAdminPlayersDB = function(players) {
            const container = document.getElementById('admin-players-list-db');
            let html = '<table style="width:100%">';
            players.forEach(p => {
                html += `<tr>
                    <td>${p.name || 'Nenurodytas'}</td>
                    <td>
                        <button type="button" onclick="window.openAdminEditModal('${p.id}')">Keisti</button>
                        <button type="button" onclick="window.deleteAdminPlayerLive('${p.id}')">Trinti</button>
                    </td>
                </tr>`;
            });
            html += '</table>';
            container.innerHTML = html;
        };

        // 3. Redagavimo atidarymas (Paima duomenis tik pagal ID)
        window.openAdminEditModal = function(id) {
            let p = window.adminGlobalPlayers.find(x => String(x.id) === String(id));
            if(!p) return;
            document.getElementById('editAdminPlayerId').value = p.id;
            document.getElementById('editAdminPlayerName').value = p.name || '';
            document.getElementById('editAdminPlayerRating').value = p.rating || 300;
            document.getElementById('adminEditPlayerModal').style.display = 'flex';
        };

        window.closeAdminEditModal = function() { document.getElementById('adminEditPlayerModal').style.display = 'none'; };

        // 4. Išsaugojimas
        window.saveAdminPlayerChanges = function() {
            const id = document.getElementById('editAdminPlayerId').value;
            const name = document.getElementById('editAdminPlayerName').value;
            const rating = parseInt(document.getElementById('editAdminPlayerRating').value);
            
            firebase.database().ref(GLOBAL_PLAYERS_KEY + '/' + id).update({ name, rating }).then(() => {
                alert("Išsaugota!");
                window.closeAdminEditModal();
                window.loadAdminPlayersDB();
            });
        };

        // 5. Trynimas
        window.deleteAdminPlayerLive = function(id) {
            if(confirm("Trinti?")) {
                firebase.database().ref(GLOBAL_PLAYERS_KEY + '/' + String(id).trim()).remove().then(() => {
                    window.loadAdminPlayersDB();
                });
            }
        };

        // Paleidimas
        window.addEventListener('load', () => {
            if(typeof firebase !== 'undefined') window.loadAdminPlayersDB();
        });
    </script>
</body>
</html>
